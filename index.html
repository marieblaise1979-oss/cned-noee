us:14px;padding:15px;margin:12px 0}.reading-text{background:#fff;border-left:4px solid var(--accent);padding:12px;border-radius:9px}\n.model{display:none;background:#faf5ff;border-left:4px solid var(--accent);padding:10px;margin-top:8px;border-radius:8px}.oral-mission.open .model{display:block}.review{background:#eff6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin:9px 0}\n@media(max-width:760px){.routine{grid-template-columns:1fr 1fr}.g2,.g3,.flash-grid{grid-template-columns:1fr}.oral-row{align-items:flex-start;flex-direction:column}}\n@media print{body{background:white}.toolbar,.screen-only,.audio,.quiz-next{display:none!important}section{box-shadow:none;break-inside:auto}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flash-card .fr,.model{display:block!important}}\n</style></head>\n<body><main id=\"root\"></main>\n<script>\nconst S={\"title\": \"Poor Cinderella!\", \"subtitle\": \"Les corvées et l’obligation : comprendre ce que Cendrillon devait faire.\", \"objectives\": [\"Je connais le vocabulaire principal des corvées ménagères.\", \"Je sais utiliser have to / don’t have to au présent.\", \"Je sais exprimer une obligation au passé avec had to.\", \"Je sais aussi utiliser was/were obliged to.\"], \"vocab\": [[\"tidy the house\", \"ranger la maison\"], [\"do the hoovering\", \"passer l’aspirateur\"], [\"scrub the floor\", \"récurer le sol\"], [\"dust\", \"faire la poussière\"], [\"clean the windows\", \"nettoyer les fenêtres\"], [\"make a bed\", \"faire un lit\"], [\"do the washing up\", \"faire la vaisselle\"], [\"do the ironing\", \"faire le repassage\"], [\"cut the grass\", \"couper l’herbe\"], [\"have to\", \"devoir / être obligé de\"], [\"don’t have to\", \"ne pas être obligé de\"], [\"had to\", \"devait / a dû\"], [\"was obliged to\", \"était obligé(e) de\"], [\"the stepmother\", \"la belle-mère\"], [\"the half-sisters / stepsisters\", \"les demi-sœurs / belles-sœurs\"]], \"rules\": [[\"HAVE TO au présent\", \"I/you/we/they have to + base verbale. He/she has to + base verbale.\"], [\"Absence d’obligation\", \"don’t have to / doesn’t have to = ne pas être obligé de. Ce n’est pas une interdiction.\"], [\"Obligation au passé\", \"had to + base verbale à toutes les personnes : Cinderella had to clean the house.\"], [\"Équivalent clair\", \"She was obliged to clean = Elle était obligée de nettoyer.\"], [\"MUST au passé\", \"Must n’a pas de forme passée : pour le passé on utilise had to.\"]], \"oral\": [[\"tidy the house\", \"ranger la maison\"], [\"do the hoovering\", \"passer l’aspirateur\"], [\"scrub the floor\", \"récurer le sol\"], [\"dust the furniture\", \"faire la poussière\"], [\"clean the windows\", \"nettoyer les fenêtres\"], [\"make a bed\", \"faire un lit\"], [\"do the washing up\", \"faire la vaisselle\"], [\"do the ironing\", \"faire le repassage\"], [\"Cinderella had to scrub the floor.\", \"Cendrillon devait récurer le sol.\"], [\"She was obliged to stay at home.\", \"Elle était obligée de rester à la maison.\"]], \"reading\": {\"title\": \"Atelier culture commune : reconnaître un conte grâce à un indice\", \"text\": \"A brick house. A bad witch at a princess’s birthday. A magic mirror. A shoe that is too small. Three bowls of porridge. Someone sleeping in a bed. A cat bringing presents to a king. A wolf wearing a grandmother’s clothes.\", \"questions\": [[\"Brick house → quel conte ?\", [\"the three little pigs\"]], [\"Magic mirror → quel conte ?\", [\"snow white and the seven dwarfs\", \"snow white\"]], [\"Three bowls of porridge → quel conte ?\", [\"goldilocks and the three bears\"]], [\"A shoe that is too small → quel conte ?\", [\"cinderella\"]], [\"Wolf + grandmother → quel conte ?\", [\"little red riding hood\"]]]}, \"written\": [[\"Traduis : ranger la maison\", [\"tidy the house\"]], [\"Traduis : passer l’aspirateur\", [\"do the hoovering\"]], [\"Traduis : récurer le sol\", [\"scrub the floor\"]], [\"Traduis : faire la vaisselle\", [\"do the washing up\"]], [\"Traduis : Cendrillon devait rester à la maison.\", [\"cinderella had to stay at home\"]], [\"Traduis : Ses sœurs devaient aller au bal.\", [\"her sisters had to go to the ball\"]], [\"Traduis : Le prince devait retrouver Cendrillon.\", [\"the prince had to find cinderella again\", \"the prince had to find cinderella\"]], [\"Traduis : Elle était obligée de nettoyer les fenêtres.\", [\"she was obliged to clean the windows\"]], [\"Complète : She ____ to do the ironing. (passé)\", [\"had\"]], [\"Complète : He doesn’t ____ to go to school today.\", [\"have\"]]], \"quiz\": [[\"had to exprime…\", [\"une obligation au passé\", \"une interdiction\", \"un futur\", \"une préférence\"], 0, \"had to = obligation au passé.\"], [\"Must au passé devient généralement…\", [\"musted\", \"had to\", \"did must\", \"was must\"], 1, \"On utilise had to.\"], [\"doesn’t have to signifie…\", [\"ne doit surtout pas\", \"n’est pas obligé de\", \"devait\", \"a envie de\"], 1, \"Absence d’obligation.\"], [\"scrub the floor = …\", [\"récurer le sol\", \"faire le lit\", \"repasser\", \"tondre\"], 0, \"scrub the floor.\"], [\"do the ironing = …\", [\"faire la vaisselle\", \"faire le repassage\", \"passer l’aspirateur\", \"ranger\"], 1, \"ironing = repassage.\"], [\"Phrase correcte au passé :\", [\"She had to clean.\", \"She had clean to.\", \"She hadded to clean.\", \"She had to cleaned.\"], 0, \"had to + base verbale.\"], [\"Was obliged to signifie…\", [\"était obligée de\", \"avait envie de\", \"ne devait pas\", \"avait fini de\"], 0, \"obligée de.\"], [\"Quelle phrase exprime l’absence d’obligation ?\", [\"She must clean.\", \"She had to clean.\", \"She doesn’t have to clean.\", \"She was obliged to clean.\"], 2, \"doesn’t have to.\"], [\"make a bed = …\", [\"fabriquer un lit\", \"faire un lit\", \"acheter un lit\", \"dormir\"], 1, \"make a bed.\"], [\"cut the grass = …\", [\"couper l’herbe\", \"nettoyer les vitres\", \"faire la poussière\", \"balayer\"], 0, \"cut the grass.\"]], \"oral_missions\": [[\"Dis 4 corvées que Cendrillon devait faire avec had to.\", \"Cinderella had to tidy the house, scrub the floor…\"], [\"Reformule une phrase avec was obliged to.\", \"She was obliged to clean the windows.\"], [\"Dis une chose qu’elle n’était pas obligée de faire.\", \"She didn’t have to…\"], [\"Parle 30 secondes : « Cinderella’s chores » en utilisant au moins 3 verbes et had to + was obliged to.\", \"Cinderella had to… She was obliged to…\"]], \"final\": [[\"Obligation passée :\", [\"had to + base verbale\", \"must + -ed\", \"did + had\", \"was + verb-ing\"], 0, \"had to + base verbale.\"], [\"do the washing up = …\", [\"repasser\", \"faire la vaisselle\", \"balayer\", \"faire le lit\"], 1, \"washing up = vaisselle.\"], [\"He ____ to clean yesterday.\", [\"had\", \"has\", \"have\", \"musted\"], 0, \"had to.\"], [\"She was obliged to stay = …\", [\"Elle était obligée de rester.\", \"Elle voulait partir.\", \"Elle n’avait pas besoin de rester.\", \"Elle restera.\"], 0, \"obligée de rester.\"], [\"don’t have to = …\", [\"interdiction\", \"absence d’obligation\", \"passé\", \"ordre\"], 1, \"absence d’obligation.\"], [\"Quel verbe signifie « faire la poussière » ?\", [\"dust\", \"scrub\", \"tidy\", \"cut\"], 0, \"dust.\"]], \"recall\": [[\"had to + ?\", \"base verbale\"], [\"Must au passé ?\", \"had to\"], [\"do the hoovering ?\", \"passer l’aspirateur\"], [\"do the ironing ?\", \"faire le repassage\"], [\"scrub the floor ?\", \"récurer le sol\"], [\"Deux façons de dire « elle devait nettoyer » ?\", \"She had to clean. / She was obliged to clean.\"]]};\nconst session=4;\nconst esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');\nconst strict=(v)=>String(v||'').toLowerCase().replace(/[?!.,;:’']/g,'').replace(/\\s+/g,' ').trim();\nconst loose=(v)=>strict(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst root=document.getElementById('root');\n\nfunction readingHTML(){\n const r=S.reading;\n return `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 5 - So much to do!", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 5 - So much to do!</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:18px}\n.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:28px 24px;margin:12px 0 20px;box-shadow:0 10px 26px rgba(49,46,129,.16)}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:8px 0 0}.eyebrow{font-size:13px;color:#e9d5ff;font-weight:800;letter-spacing:.03em}.pill{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12)}\n.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:16px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;display:i ay:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}.choice:hover{border-color:#a78bfa}.feedback{display:none;margin-top:9px;padding:10px;border-radius:9px;font-weight:700}.feedback.good{display:block;background:var(--okbg);color:var(--ok)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}.feedback.almost{display:block;background:var(--warnbg);color:var(--warn)}\n.progress{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 15px}.progress div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none}.score{font-size:29px;font-weight:900;color:#5b21b6}\n.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.inputrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}\n.reading{background:#fbfaff;border:1px solid #ddd6fe;border-radius:14px;padding:15px;margin:12px 0}.reading-text{background:#fff;border-left:4px solid var(--accent);padding:12px;border-radius:9px}\n.model{display:none;background:#faf5ff;border-left:4px solid var(--accent);padding:10px;margin-top:8px;border-radius:8px}.oral-mission.open .model{display:block}.review{background:#eff6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin:9px 0}\n@media(max-width:760px){.routine{grid-template-columns:1fr 1fr}.g2,.g3,.flash-grid{grid-template-columns:1fr}.oral-row{align-items:flex-start;flex-direction:column}}\n@media print{body{background:white}.toolbar,.screen-only,.audio,.quiz-next{display:none!important}section{box-shadow:none;break-inside:auto}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flash-card .fr,.model{display:block!important}}\n</style></head>\n<body><main id=\"root\"></main>\n<script>\nconst S={\"title\": \"So much to do!\", \"subtitle\": \"Approfondir les corvées, le prétérit et les questions sur l’obligation passée.\", \"objectives\": [\"Je connais six nouvelles corvées.\", \"Je maîtrise le prétérit affirmatif, négatif et interrogatif.\", \"Je sais poser des questions avec did + sujet + base verbale.\", \"Je sais demander ce que quelqu’un devait faire.\", \"Je sais utiliser made + pronom complément + base verbale.\"], \"vocab\": [[\"lay the table\", \"mettre la table\"], [\"clear the table\", \"débarrasser la table\"], [\"do the shopping\", \"faire les courses\"], [\"babysit little brothers or sisters\", \"garder ses petits frères ou sœurs\"], [\"sweep the floor\", \"balayer le sol\"], [\"wash the car\", \"laver la voiture\"], [\"did\", \"auxiliaire du prétérit interrogatif\"], [\"didn’t\", \"auxiliaire négatif au prétérit\"], [\"What did … have to do?\", \"Que devait … faire ?\"], [\"make someone do something\", \"obliger / faire faire quelque chose à quelqu’un\"], [\"me / you / him / her / it / us / them\", \"pronoms compléments\"]], \"rules\": [[\"Prétérit affirmatif\", \"Verbe régulier : verb + -ed. Verbe irrégulier : forme spéciale. Ex. went, did, had.\"], [\"Prétérit négatif\", \"Sujet + didn’t + base verbale : She didn’t clean.\"], [\"Prétérit interrogatif\", \"Did + sujet + base verbale ? Did she clean?\"], [\"Question sur l’obligation passée\", \"Did Cinderella have to…? / What did Cinderella have to do?\"], [\"Imposer une action\", \"Sujet + made + pronom complément + base verbale : Her stepmother made her clean.\"]], \"oral\": [[\"lay the table\", \"mettre la table\"], [\"clear the table\", \"débarrasser la table\"], [\"do the shopping\", \"faire les courses\"], [\"sweep the floor\", \"balayer le sol\"], [\"wash the car\", \"laver la voiture\"], [\"Did Cinderella have to sweep the floor?\", \"Cendrillon devait-elle balayer le sol ?\"], [\"What did Cinderella have to do?\", \"Que devait faire Cendrillon ?\"], [\"Her stepmother made her clean the rooms.\", \"Sa belle-mère lui faisait nettoyer les pièces.\"], [\"She didn’t go to the ball.\", \"Elle n’est pas allée au bal.\"], [\"Did the sisters make their beds?\", \"Les sœurs ont-elles fait leurs lits ?\"]], \"reading\": {\"title\": \"Atelier prétérit : entendre et repérer le verbe au passé\", \"text\": \"Clique sur les boutons audio dans les exercices ci-dessous et note seulement le ou les verbes au passé que tu entends.\", \"questions\": [[\"I went to the market yesterday.\", [\"went\"]], [\"She had to sweep the floor.\", [\"had\"]], [\"The prince found the slipper.\", [\"found\"]], [\"Cinderella ran back home.\", [\"ran\"]], [\"The fairy gave her a beautiful dress.\", [\"gave\"]]]}, \"written\": [[\"Traduis : mettre la table\", [\"lay the table\"]], [\"Traduis : débarrasser la table\", [\"clear the table\"]], [\"Traduis : faire les courses\", [\"do the shopping\"]], [\"Traduis : balayer le sol\", [\"sweep the floor\"]], [\"Mets au passé négatif : Susan laid the table.\", [\"susan didn't lay the table\", \"susan did not lay the table\"]], [\"Mets en question : Richard swept the floor.\", [\"did richard sweep the floor\"]], [\"Traduis : Cendrillon devait faire toutes les corvées.\", [\"cinderella had to do all the chores\"]], [\"Traduis : Cendrillon devait-elle faire toutes les corvées ?\", [\"did cinderella have to do all the chores\"]], [\"Traduis : Que devait faire Cendrillon ?\", [\"what did cinderella have to do\"]], [\"Traduis : Sa belle-mère lui faisait nettoyer toutes les pièces.\", [\"her stepmother made her clean all the rooms\"]]], \"listen\": [[\"I went to the cinema last Saturday.\", [\"went\"]], [\"Cinderella had to stay at home.\", [\"had\"]], [\"The prince found the glass slipper.\", [\"found\"]], [\"The fairy took a pumpkin and four mice.\", [\"took\"]], [\"Cinderella ran back home and lost a slipper.\", [\"ran lost\", \"lost ran\"]]], \"quiz\": [[\"Au prétérit négatif, on utilise…\", [\"didn’t + base verbale\", \"didn’t + verbe au passé\", \"don’t + base verbale\", \"had + infinitif\"], 0, \"didn’t + base verbale.\"], [\"Question correcte :\", [\"Did she went?\", \"Did she go?\", \"She did go?\", \"Did went she?\"], 1, \"Did + sujet + base verbale.\"], [\"Le passé de go est…\", [\"goed\", \"went\", \"gone\", \"goes\"], 1, \"went.\"], [\"Le passé de do est…\", [\"did\", \"done\", \"doed\", \"does\"], 0, \"did.\"], [\"« Que devait-elle faire ? » =\", [\"What did she have to do?\", \"What she had to do?\", \"What did she had to do?\", \"What does she have to did?\"], 0, \"What did + sujet + have to + base.\"], [\"made her clean signifie…\", [\"lui faisait nettoyer\", \"nettoyait avec elle\", \"ne nettoyait pas\", \"avait nettoyé\"], 0, \"make + personne + base = faire faire.\"], [\"Pronom complément de she :\", [\"she\", \"her\", \"hers\", \"herself\"], 1, \"her.\"], [\"Pronom complément de they :\", [\"they\", \"their\", \"them\", \"themselves\"], 2, \"them.\"], [\"sweep the floor =\", [\"balayer le sol\", \"récurer le sol\", \"tondre\", \"faire la poussière\"], 0, \"sweep = balayer.\"], [\"lay the table =\", [\"débarrasser\", \"mettre la table\", \"laver la voiture\", \"faire le lit\"], 1, \"lay the table.\"]], \"oral_missions\": [[\"Pose 3 questions avec Did … have to…?\", \"Did Cinderella have to…?\"], [\"Explique 3 choses que la belle-mère imposait à Cendrillon avec made her.\", \"Her stepmother made her…\"], [\"Raconte 4 actions au passé avec went, found, ran, lost.\", \"She went… The prince found…\"], [\"Écoute puis répète : What did Cinderella have to do?\", \"What did Cinderella have to do?\"]], \"final\": [[\"Phrase négative correcte :\", [\"She didn’t went.\", \"She didn’t go.\", \"She not went.\", \"She did not went.\"], 1, \"didn’t + base verbale.\"], [\"Le passé de find est…\", [\"found\", \"finded\", \"fell\", \"felt\"], 0, \"found.\"], [\"Le pronom complément de he est…\", [\"him\", \"he\", \"his\", \"himself\"], 0, \"him.\"], [\"made them try signifie…\", [\"leur faisait essayer\", \"les regardait essayer\", \"ils ont essayé\", \"ils devaient partir\"], 0, \"made + them + try.\"], [\"Question correcte :\", [\"Did Cinderella have to clean?\", \"Did Cinderella had to clean?\", \"Cinderella did have to clean?\", \"Did Cinderella to clean?\"], 0, \"Did + sujet + have to.\"], [\"clear the table =\", [\"mettre la table\", \"débarrasser la table\", \"balayer\", \"laver\"], 1, \"clear the table.\"]], \"recall\": [[\"Structure question au prétérit ?\", \"Did + sujet + base verbale ?\"], [\"Structure question obligation passée ?\", \"Did + sujet + have to + base verbale ?\"], [\"What did she have to do ?\", \"Que devait-elle faire ?\"], [\"make someone do ?\", \"faire / obliger quelqu’un à faire\"], [\"she → pronom complément ?\", \"her\"], [\"they → pronom complément ?\", \"them\"]]};\nconst session=5;\nconst esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');\nconst strict=(v)=>String(v||'').toLowerCase().replace(/[?!.,;:’']/g,'').replace(/\\s+/g,' ').trim();\nconst loose=(v)=>strict(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst root=document.getElementById('root');\n\nfunction readingHTML(){\n const r=S.reading;\n return `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 6 - The glass slipper", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 6 - The glass slipper</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:18px}\n.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:28px 24px;margin:12px 0 20px;box-shadow:0 10px 26px rgba(49,46,129,.16)}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:8px 0 0}.eyebrow{font-size:13px;color:#e9d5ff;font-weight:800;letter-spacing:.03em}.pill{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12)}\n.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:16px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#5b21b6}.ghost{background:white;color:#333;border:1px solid var(--line)}\nsection{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 16px rgba(0,0,0,.025)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.muted{color:var(--muted);font-size:14px}\n.objectives label{display:block;margin:7px 0}.routine{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.routine div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fafafa}.routine b{display:block;font-size:18px}\n.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.rule{background:var(--warnbg);border-left:5px solid #f59e0b}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:13px;border-radius:10px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:#f3f4f6}\n.flash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flash-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;text-align:left;min-height:88px}.flash-card .en{font-weight:800;font-size:18px}.flash-card .fr{display:none;color:#5b21b6;margin-top:7px;font-weight:700}.flash-card.open .fr{display:block}\n.oral-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.oral-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.repeat{font-size:13px}.audio{background:#eef2ff;color:#3730a3;padding:7px 10px;border-radius:9px}\n.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:17px;background:#fdfcff}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}.choice:hover{border-color:#a78bfa}.feedback{display:none;margin-top:9px;padding:10px;border-radius:9px;font-weight:700}.feedback.good{display:block;background:var(--okbg);color:var(--ok)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}.feedback.almost{display:block;background:var(--warnbg);color:var(--warn)}\n.progress{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 15px}.progress div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none}.score{font-size:29px;font-weight:900;color:#5b21b6}\n.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.inputrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}\n.reading{background:#fbfaff;border:1px solid #ddd6fe;border-radius:14px;padding:15px;margin:12px 0}.reading-text{background:#fff;border-left:4px solid var(--accent);padding:12px;border-radius:9px}\n.model{display:none;background:#faf5ff;border-left:4px solid var(--accent);padding:10px;margin-top:8px;border-radius:8px}.oral-mission.open .model{display:block}.review{background:#eff6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin:9px 0}\n@media(max-width:760px){.routine{grid-template-columns:1fr 1fr}.g2,.g3,.flash-grid{grid-template-columns:1fr}.oral-row{align-items:flex-start;flex-direction:column}}\n@media print{body{background:white}.toolbar,.screen-only,.audio,.quiz-next{display:none!important}section{box-shadow:none;break-inside:auto}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flash-card .fr,.model{display:block!important}}\n</style></head>\n<body><main id=\"root\"></main>\n<script>\nconst S={\"title\": \"The glass slipper\", \"subtitle\": \"Lire Cendrillon comme une enquête : suivre les personnages, les actions et les verbes irréguliers.\", \"objectives\": [\"Je connais les nouveaux verbes du récit.\", \"Je sais suivre un texte long en repérant les référents d’un personnage.\", \"Je connais les principales formules des contes.\", \"Je mémorise les verbes irréguliers essentiels du CNED.\", \"Je sais extraire des informations précises d’un conte.\"], \"vocab\": [[\"to laugh\", \"rire\"], [\"to turn into\", \"se transformer en\"], [\"to strike\", \"sonner / frapper\"], [\"to try\", \"essayer\"], [\"to put on\", \"mettre / enfiler\"], [\"to fit\", \"aller à la bonne taille\"], [\"a glass slipper\", \"une pantoufle de verre\"], [\"a stepmother\", \"une belle-mère\"], [\"stepsisters\", \"des belles-sœurs / demi-sœurs\"], [\"rags\", \"des haillons\"], [\"a gown\", \"une robe de bal\"], [\"a fireplace\", \"une cheminée\"], [\"a ball\", \"un bal\"], [\"a messenger\", \"un messager\"], [\"a kingdom\", \"un royaume\"], [\"Once upon a time…\", \"Il était une fois…\"], [\"They lived happily ever after.\", \"Ils vécurent heureux pour toujours.\"]], \"rules\": [[\"Suivre les référents\", \"Cinderella peut être appelée : a beautiful girl, she, the poor girl, the stepdaughter, the girl, my darling, his beloved princess.\"], [\"Lire comme un détective\", \"Repère les personnages, les objets, les verbes au passé et les connecteurs temporels. Fais des hypothèses puis vérifie-les.\"], [\"Verbes irréguliers à connaître\", \"be→was/were; begin→began; fall→fell; find→found; give→gave; go→went; have→had; lose→lost; run→ran; say→said; see→saw; sleep→slept; take→took; tell→told.\"], [\"Chronologie\", \"Les contes utilisent souvent : one day, suddenly, eventually, then, finally.\"], [\"Formules traditionnelles\", \"Beginning: Once upon a time… / Ending: They got married and lived happily ever after.\"]], \"oral\": [[\"laugh\", \"rire\"], [\"turn into\", \"se transformer en\"], [\"strike twelve\", \"sonner douze coups\"], [\"try the slipper on\", \"essayer la pantoufle\"], [\"put on the shoe\", \"enfiler la chaussure\"], [\"It fitted perfectly.\", \"Elle allait parfaitement.\"], [\"Once upon a time, there lived a beautiful girl named Cinderella.\", \"Il était une fois une belle jeune fille appelée Cendrillon.\"], [\"The prince found the glass slipper.\", \"Le prince trouva la pantoufle de verre.\"], [\"Cinderella ran back home and lost one slipper.\", \"Cendrillon rentra en courant et perdit une pantoufle.\"], [\"They got married and lived happily ever after.\", \"Ils se marièrent et vécurent heureux pour toujours.\"]], \"reading\": {\"title\": \"Atelier enquête : un mini-conte à analyser\", \"text\": \"Once upon a time, a beautiful and kind princess lived with her parents in a castle. One night, an ugly monster captured the gentle young lady and locked her in a huge dark tower. The king promised a reward to any brave knight who could rescue her. Several knights rode to the tower, but the monster roared dreadfully and they ran away. Later, a friendly dragon heard the girl cry. He entered the tower, took a sword, rescued the princess and carried her gently on his strong back. Eventually they reached the castle. The princess kissed the dragon and suddenly he became a handsome prince. They got married and lived happily ever after.\", \"questions\": [[\"Trouve 2 mots transparents.\", [\"princess monster\", \"monster dragon\", \"castle princess\", \"dragon princess\"]], [\"Trouve 2 adverbes.\", [\"dreadfully gently\", \"gently eventually\", \"eventually suddenly\", \"suddenly gently\"]], [\"Relève 4 verbes irréguliers au passé.\", [\"lived captured locked promised\", \"rode ran heard took\", \"heard took ran became\", \"took became got ran\"]], [\"Donne 4 expressions qui désignent la princesse.\", [\"princess gentle young lady girl her\"]], [\"Quel personnage devient prince ?\", [\"the dragon\", \"dragon\"]]]}, \"written\": [[\"Traduis : rire\", [\"laugh\", \"to laugh\"]], [\"Traduis : se transformer en\", [\"turn into\", \"to turn into\"]], [\"Traduis : essayer la pantoufle\", [\"try the slipper on\", \"try on the slipper\"]], [\"Traduis : la pantoufle de verre\", [\"the glass slipper\", \"a glass slipper\"]], [\"Complète : go → ____\", [\"went\"]], [\"Complète : fall → ____\", [\"fell\"]], [\"Complète : lose → ____\", [\"lost\"]], [\"Complète : run → ____\", [\"ran\"]], [\"Complète : take → ____\", [\"took\"]], [\"Complète : tell → ____\", [\"told\"]], [\"Traduis : Le prince trouva la pantoufle.\", [\"the prince found the slipper\", \"the prince found the glass slipper\"]], [\"Traduis : Cendrillon rentra en courant.\", [\"cinderella ran back home\", \"cinderella ran home\"]]], \"quiz\": [[\"fit signifie…\", [\"aller à la bonne taille\", \"tomber\", \"courir\", \"rire\"], 0, \"fit = aller / convenir en taille.\"], [\"Le passé de lose est…\", [\"lost\", \"losed\", \"lose\", \"loose\"], 0, \"lose → lost.\"], [\"Le passé de take est…\", [\"taked\", \"took\", \"taken\", \"takes\"], 1, \"take → took.\"], [\"Quel référent peut désigner Cendrillon ?\", [\"the poor girl\", \"the monster\", \"the king\", \"the dragon\"], 0, \"the poor girl.\"], [\"Formule traditionnelle de fin :\", [\"Once upon a time\", \"They lived happily ever after\", \"Long ago\", \"In the castle\"], 1, \"…lived happily ever after.\"], [\"Le passé de run est…\", [\"runned\", \"ran\", \"runed\", \"running\"], 1, \"run → ran.\"], [\"Le passé de give est…\", [\"gave\", \"given\", \"gived\", \"give\"], 0, \"give → gave.\"], [\"turn into signifie…\", [\"essayer\", \"se transformer en\", \"mettre\", \"sonner\"], 1, \"turn into = se transformer en.\"], [\"Dans un texte long, les référents servent à…\", [\"éviter de répéter le nom et suivre le personnage\", \"indiquer le temps\", \"traduire les verbes\", \"faire le pluriel\"], 0, \"Ils permettent de suivre qui est désigné.\"], [\"Quel mot indique une fin de récit ?\", [\"eventually\", \"yesterday\", \"because\", \"but\"], 0, \"eventually = finalement.\"]], \"oral_missions\": [[\"Raconte Cendrillon en 5 phrases au passé.\", \"Once upon a time… Cinderella had to… The fairy took… She went…\"], [\"Récite 8 verbes irréguliers : infinitif + prétérit.\", \"go-went, find-found, give-gave…\"], [\"Donne 4 référents possibles de Cinderella.\", \"Cinderella, she, the poor girl, the stepdaughter…\"], [\"Lis le mini-conte à voix haute en marquant les mots de chronologie.\", \"Once upon a time… One night… Later… Eventually… Suddenly…\"]], \"final\": [[\"Le passé de see est…\", [\"saw\", \"seen\", \"seed\", \"sawing\"], 0, \"see → saw.\"], [\"Le passé de sleep est…\", [\"slept\", \"sleeped\", \"slipt\", \"sleep\"], 0, \"sleep → slept.\"], [\"The poor girl peut désigner…\", [\"Cinderella\", \"the prince\", \"the king\", \"the monster\"], 0, \"Cinderella.\"], [\"strike twelve signifie…\", [\"essayer à midi\", \"sonner douze coups\", \"courir douze fois\", \"tomber à minuit\"], 1, \"strike twelve.\"], [\"Quel verbe est irrégulier ?\", [\"clean\", \"listen\", \"find\", \"wash\"], 2, \"find → found.\"], [\"Beginning formula :\", [\"Once upon a time…\", \"They lived happily…\", \"Eventually\", \"At the end\"], 0, \"Once upon a time…\"]], \"recall\": [[\"go / passé ?\", \"went\"], [\"find / passé ?\", \"found\"], [\"lose / passé ?\", \"lost\"], [\"run / passé ?\", \"ran\"], [\"4 référents de Cinderella ?\", \"Cinderella, she, the poor girl, the girl…\"], [\"Formule de fin ?\", \"They got married and lived happily ever after.\"]]};\nconst session=6;\nconst esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');\nconst strict=(v)=>String(v||'').toLowerCase().replace(/[?!.,;:’']/g,'').replace(/\\s+/g,' ').trim();\nconst loose=(v)=>strict(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst root=document.getElementById('root');\n\nfunction readingHTML(){\n const r=S.reading;\n return `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 7 - Princess Cinderella", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 7 - Princess Cinderella</ti ement\"], [\"clearly\", \"clairement\"], [\"simply\", \"simplement\"], [\"convincingly\", \"de manière convaincante\"]], \"rules\": [[\"Règle générale\", \"adjectif + -ly → adverbe : gentle → gently, sudden → suddenly, perfect → perfectly.\"], [\"Y devient I\", \"happy → happily.\"], [\"E final peut disparaître\", \"simple → simply.\"], [\"Adjectifs en -al\", \"eventual → eventually ; grammatical → grammatically.\"], [\"Rôle de l’adverbe\", \"Il précise comment l’action se déroule : The fairy spoke gently. The prince immediately fell in love.\"]], \"oral\": [[\"magic – magically\", \"magique – magiquement\"], [\"gentle – gently\", \"doux – doucement\"], [\"sudden – suddenly\", \"soudain – soudainement\"], [\"eventual – eventually\", \"final – finalement\"], [\"mocking – mockingly\", \"moqueur – sur un ton moqueur\"], [\"perfect – perfectly\", \"parfait – parfaitement\"], [\"immediate – immediately\", \"immédiat – immédiatement\"], [\"happy – happily\", \"heureux – heureusement\"], [\"The fairy spoke gently.\", \"La fée parla doucement.\"], [\"Cinderella suddenly ran away.\", \"Cendrillon s’enfuit soudainement.\"]], \"reading\": {\"title\": \"Atelier -LY : repérer l’adverbe et son adjectif\", \"text\": \"The fairy magically changed the pumpkin. She gently spoke to Cinderella. The prince immediately fell in love. The stepmother laughed mockingly. Cinderella suddenly ran away. Eventually the prince found her. They lived happily ever after and the slipper fitted perfectly.\", \"questions\": [[\"Adverbe formé sur magic ?\", [\"magically\"]], [\"Adverbe formé sur gentle ?\", [\"gently\"]], [\"Adverbe formé sur sudden ?\", [\"suddenly\"]], [\"Adverbe formé sur happy ?\", [\"happily\"]], [\"Adverbe signifiant « finalement » ?\", [\"eventually\"]]]}, \"written\": [[\"Transforme : magical →\", [\"magically\"]], [\"Transforme : gentle →\", [\"gently\"]], [\"Transforme : sudden →\", [\"suddenly\"]], [\"Transforme : happy →\", [\"happily\"]], [\"Transforme : perfect →\", [\"perfectly\"]], [\"Transforme : immediate →\", [\"immediately\"]], [\"Transforme : eventual →\", [\"eventually\"]], [\"Traduis : magiquement\", [\"magically\"]], [\"Traduis : soudainement\", [\"suddenly\"]], [\"Traduis : finalement\", [\"eventually\"]], [\"Traduis : parfaitement\", [\"perfectly\"]], [\"Traduis : sur un ton moqueur\", [\"mockingly\"]]], \"quiz\": [[\"Adverbe de gentle :\", [\"gentlely\", \"gently\", \"gentily\", \"gentle\"], 1, \"gentle → gently.\"], [\"Adverbe de happy :\", [\"happyly\", \"happily\", \"happely\", \"happy\"], 1, \"y devient i.\"], [\"Adverbe de eventual :\", [\"eventualy\", \"eventually\", \"eventualily\", \"eventual\"], 1, \"eventual → eventually.\"], [\"mockingly signifie…\", [\"sur un ton moqueur\", \"magiquement\", \"soudainement\", \"parfaitement\"], 0, \"mockingly.\"], [\"perfectly signifie…\", [\"immédiatement\", \"parfaitement\", \"doucement\", \"finalement\"], 1, \"perfectly.\"], [\"immediately vient de…\", [\"immediate\", \"immédiat + français\", \"image\", \"imitate\"], 0, \"immediate + -ly.\"], [\"Quel mot est un adverbe ?\", [\"gentle\", \"sudden\", \"happily\", \"perfect\"], 2, \"happily.\"], [\"The prince immediately fell in love : immediately précise…\", [\"comment / quand très vite l’action se produit\", \"le sujet\", \"le lieu\", \"le nom\"], 0, \"L’adverbe précise l’action.\"], [\"simple →\", [\"simplely\", \"simply\", \"simpely\", \"simple\"], 1, \"Le e disparaît.\"], [\"clear →\", [\"clearly\", \"clearfully\", \"cleary\", \"clearlly\"], 0, \"clearly.\"]], \"oral_missions\": [[\"Raconte 5 étapes de Cendrillon en ajoutant au moins 3 adverbes.\", \"The fairy magically… Cinderella suddenly… Eventually…\"], [\"Transforme oralement 6 adjectifs en adverbes.\", \"gentle-gently, sudden-suddenly…\"], [\"Lis le paragraphe -LY lentement puis normalement.\", \"The fairy magically changed…\"], [\"Crée deux phrases avec immediately et happily.\", \"The prince immediately… / They lived happily…\"]], \"final\": [[\"happy →\", [\"happi l=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 8 - Je m’évalue – Fairy tales", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 8 - Je m’évalue – Fairy tales</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:18px}\n.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:28px 24px;margin:12px 0 20px;box-shadow:0 10px 26px rgba(49,46,129,.16)}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:8px 0 0}.eyebrow{font-size:13px;color:#e9d5ff;font-weight:800;letter-spacing:.03em}.pill{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12)}\n.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:16px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#5b21b6}.ghost{background:white;color:#333;border:1px solid var(--line)}\nsection{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 16px rgba(0,0,0,.025)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.muted{color:var(--muted);font-size:14px}\n.objectives label{display:block;margin:7px 0}.routine{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.routine div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fafafa}.routine b{display:block;font-size:18px}\n.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.rule{background:var(--warnbg);border-left:5px solid #f59e0b}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:13px;border-radius:10px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:#f3f4f6}\n.flash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flash-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;text-align:left;min-height:88px}.flash-card .en{font-weight:800;font-size:18px}.flash-card .fr{display:none;color:#5b21b6;margin-top:7px;font-weight:700}.flash-card.open .fr{display:block}\n.oral-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.oral-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.repeat{font-size:13px}.audio{background:#eef2ff;color:#3730a3;padding:7px 10px;border-radius:9px}\n.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:17px;background:#fdfcff}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}.choice:hover{border-color:#a78bfa}.feedback{display:none;margin-top:9px;padding:10px;border-radius:9px;font-weight:700}.feedback.good{display:block;background:var(--okbg);color:var(--ok)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}.feedback.almost{display:block;background:var(--warnbg);color:var(--warn)}\n.progress{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 15px}.progress div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none}.score{font-size:29px;font-weight:900;color:#5b21b6}\n.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.inputrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}\n.reading{background:#fbfaff;border:1px solid #ddd6fe;border-radius:14px;padding:15px;margin:12px 0}.reading-text{background:#fff;border-left:4px solid var(--accent);padding:12px;border-radius:9px}\n.model{display:none;background:#faf5ff;border-left:4px solid var(--accent);padding:10px;margin-top:8px;border-radius:8px}.oral-mission.open .model{display:block}.review{background:#eff6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin:9px 0}\n@media(max-width:760px){.routine{grid-template-columns:1fr 1fr}.g2,.g3,.flash-grid{grid-template-columns:1fr}.oral-row{align-items:flex-start;flex-direction:column}}\n@media print{body{background:white}.toolbar,.screen-only,.audio,.quiz-next{display:none!important}section{box-shadow:none;break-inside:auto}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flash-card .fr,.model{display:block!important}}\n</style></head>\n<body><main id=\"root\"></main>\n<script>\nconst S={\"title\": \"Je m’évalue – Fairy tales\", \"subtitle\": \"Grand entraînement de fin d’unité : lire, comprendre, écrire, écouter et parler.\", \"objectives\": [\"Je mobilise tout le vocabulaire des contes de fées.\", \"Je comprends un résumé de livre et un conte assez long.\", \"Je repère mots transparents, adjectifs, adverbes et verbes irréguliers.\", \"Je maîtrise l’obligation au passé et les questions avec did.\", \"Je peux parler des corvées de Cendrillon au passé.\"], \"vocab\": [[\"bedtime story\", \"histoire du soir\"], [\"a little mouse\", \"une petite souris\"], [\"a teddy bear\", \"un ours en peluche\"], [\"footprints\", \"des empreintes\"], [\"a hunter\", \"un chasseur\"], [\"an enemy\", \"un ter\", \"a ugly monster\"]], [\"Traduis : un dragon amical\", [\"a friendly dragon\"]], [\"Traduis : un beau prince\", [\"a handsome prince\"]], [\"Donne le passé de ride.\", [\"rode\"]], [\"Donne le passé de hear.\", [\"heard\"]], [\"Donne le passé de take.\", [\"took\"]], [\"Donne le passé de fly.\", [\"flew\"]], [\"Donne le passé de become.\", [\"became\"]], [\"Traduis : Cendrillon devait passer l’aspirateur.\", [\"cinderella had to do the hoovering\"]], [\"Traduis : Elle était obligée de faire la vaisselle.\", [\"she was obliged to do the washing up\"]], [\"Traduis : Sa belle-mère lui faisait balayer le sol.\", [\"her stepmother made her sweep the floor\"]], [\"Question : Cendrillon devait-elle nettoyer les fenêtres ?\", [\"did cinderella have to clean the windows\"]]], \"listen\": [[\"The knights rode to the tower.\", [\"rode\"]], [\"The monster roared and the knights ran away.\", [\"ran\"]], [\"The dragon heard the princess cry.\", [\"heard\"]], [\"He took a sword.\", [\"took\"]], [\"The dragon flew over the mountains.\", [\"flew\"]], [\"The king gave him a bag of diamonds.\", [\"gave\"]], [\"The princess kissed the dragon.\", [\"kissed\"]], [\"He became a handsome prince.\", [\"became\"]], [\"They got married.\", [\"got\"]], [\"They lived happily ever after.\", [\"lived\"]]], \"quiz\": [[\"Quel mot est transparent ?\", [\"tower\", \"princess\", \"sword\", \"knight\"], 1, \"princess ressemble à « princesse ».\"], [\"Quel mot est un adverbe ?\", [\"gentle\", \"gently\", \"dragon\", \"strong\"], 1, \"gently.\"], [\"Le passé de become est…\", [\"became\", \"becomed\", \"become\", \"becoming\"], 0, \"become → became.\"], [\"Le passé de fly est…\", [\"flew\", \"flied\", \"flown\", \"fled\"], 0, \"fly → flew.\"], [\"Quel référent peut désigner la princesse ?\", [\"the young lady\", \"the monster\", \"the knight\", \"the enemy\"], 0, \"young lady.\"], [\"brave décrit le mieux…\", [\"un chevalier\", \"un monstre\", \"une corvée\", \"une tour\"], 0, \"brave knight.\"], ${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidde

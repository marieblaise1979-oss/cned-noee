\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Qué lengua aprendes?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfQu\\u00e9 lengua aprendes?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfQu\\u00e9 lengua aprendes?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Aprendo castellano e inglés.</b><div><button class=\"audio\" onclick=\"speak(\\\"Aprendo castellano e ingl\\u00e9s.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Aprendo castellano e ingl\\u00e9s.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Mi amigo y yo aprendemos chino.</b><div><button class=\"audio\" onclick=\"speak(\\\"Mi amigo y yo aprendemos chino.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Mi amigo y yo aprendemos chino.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>inglés y ruso</b><div><button class=\"audio\" onclick=\"speak(\\\"ingl\\u00e9s y ruso\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"ingl\\u00e9s y ruso\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>ruso e inglés</b><div><button class=\"audio\" onclick=\"speak(\\\"ruso e ingl\\u00e9s\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"ruso e ingl\\u00e9s\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Buenos días.</b><div><button class=\"audio\" onclick=\"speak(\\\"Buenos d\\u00edas.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Buenos d\\u00edas.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Bon dia.</b><div><button class=\"audio\" onclick=\"speak(\\\"Bon dia.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Bon dia.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Bos dias.</b><div><button class=\"audio\" onclick=\"speak(\\\"Bos dias.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Bos dias.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Egunon.</b><div><button class=\"audio\" onclick=\"speak(\\\"Egunon.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Egunon.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Adiós.</b><div><button class=\"audio\" onclick=\"speak(\\\"Adi\\u00f3s.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Adi\\u00f3s.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Adéu.</b><div><button class=\"audio\" onclick=\"speak(\\\"Ad\\u00e9u.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Ad\\u00e9u.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Adeus.</b><div><button class=\"audio\" onclick=\"speak(\\\"Adeus.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Adeus.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Agur.</b><div><button class=\"audio\" onclick=\"speak(\\\"Agur.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Agur.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Yo ___ el castellano. (aprender)</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"aprendo\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Mis amigas ___ catalán. (hablar)</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"hablan\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. ¿Qué lengua ___ vosotros? (hablar)</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"habláis\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Sara y yo ___ ruso. (aprender)</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"aprendemos\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. ¿Cuántas lenguas ___ tú? (hablar)</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"hablas\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Patricia ___ castellano.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"habla\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. ruso ___ inglés</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"e\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. inglés ___ ruso</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"y\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. Cataluña →</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"catalán\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. Galicia →</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"gallego\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. País Vasco →</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"euskera\", \"vasco\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. Comunidad Valenciana →</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"valenciano\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Je parle français.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Hablo francés.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : J’apprends l’espagnol et l’anglais.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Aprendo castellano e inglés.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Quelle langue parles-tu ?</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"¿Qué lengua hablas?\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris les deux langues de ton choix avec « Hablo ».</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"Hablo ... y/e ... .\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 8</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Quelle langue parles-tu ? » :\", \"a\": [\"¿Qué lengua hablas?\", \"¿Cuál lengua eres?\", \"¿Dónde lengua vives?\", \"¿Cuándo lengua?\"], \"good\": 0}, {\"q\": \"HABLAR avec yo :\", \"a\": [\"hablo\", \"hablas\", \"habla\", \"hablamos\"], \"good\": 0}, {\"q\": \"HABLAR avec vosotros :\", \"a\": [\"habláis\", \"hablan\", \"hablamos\", \"hablas\"], \"good\": 0}, {\"q\": \"APRENDER avec nosotros :\", \"a\": [\"aprenden\", \"aprendemos\", \"aprendéis\", \"aprendo\"], \"good\": 1}, {\"q\": \"« le grec » :\", \"a\": [\"el griego\", \"el ruso\", \"el árabe\", \"el gallego\"], \"good\": 0}, {\"q\": \"« le russe » :\", \"a\": [\"el ruso\", \"el griego\", \"el portugués\", \"el euskera\"], \"good\": 0}, {\"q\": \"Langue de Galicia :\", \"a\": [\"catalán\", \"gallego\", \"euskera\", \"valenciano\"], \"good\": 1}, {\"q\": \"Langue du País Vasco :\", \"a\": [\"gallego\", \"euskera\", \"catalán\", \"italiano\"], \"good\": 1}, {\"q\": \"Devant « inglés », y devient :\", \"a\": [\"o\", \"pero\", \"e\", \"de\"], \"good\": 2}, {\"q\": \"Phrase correcte :\", \"a\": [\"ruso y inglés\", \"ruso e inglés\", \"ruso pero inglés\", \"ruso de inglés\"], \"good\": 1}, {\"q\": \"« Aprendo castellano e inglés » :\", \"a\": [\"Je parle espagnol et anglais\", \"J’apprends espagnol et anglais\", \"Je suis espagnol et anglais\", \"J’habite en Espagne\"], \"good\": 1}, {\"q\": \"« una lengua » :\", \"a\": [\"une langue\", \"une ville\", \"une nationalité\", \"une adresse\"], \"good\": 0}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 9", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 9</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 9 - ¿Cuáles son tus datos de contacto?</h1><p>Donner ses coordonnées et dire où l’on habite</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Conjuguer VIVIR</label><br><label><input type=\"checkbox\"> Dire où l’on habite avec en</label><br><label><input type=\"checkbox\"> Demander un numéro de téléphone et une adresse mail</label><br><label><input type=\"checkbox\"> Réviser nombres et alphabet</label><br><label><input type=\"checkbox\"> Répéter les sons [x] et [r] à partir des mots du cours</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>VIVIR - vivre / habiter</h3><p>vivo | vives | vive | vivimos | vivís | viven</p></div><div class=\"card\"><h3>Lieu de résidence</h3><p>¿Dónde vives?<br>Vivo en Francia, en Paris.<br>La préposition après VIVIR est toujours en dans les exemples de la leçon.</p></div><div class=\"card\"><h3>Coordonnées</h3><p>¿Cuál es tu número de móvil / teléfono fijo?<br>¿Cuál es tu correo electrónico?</p></div><div class=\"card\"><h3>Épeler une adresse</h3><p>arroba = @ ; punto = point ; guión = tiret</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>el teléfono fijo</b><div class=\"back\">le téléphone fixe</div></div><div class=\"card flash\" tabindex=\"0\"><b>el móvil</b><div class=\"back\">le téléphone portable</div></div><div class=\"card flash\" tabindex=\"0\"><b>el correo electrónico</b><div class=\"back\">l’adresse mail</div></div><div class=\"card flash\" tabindex=\"0\"><b>el país</b><div class=\"back\">le pays</div></div><div class=\"card flash\" tabindex=\"0\"><b>la ciudad</b><div class=\"back\">la ville</div></div><div class=\"card flash\" tabindex=\"0\"><b>la arroba</b><div class=\"back\">@ / arobase</div></div><div class=\"card flash\" tabindex=\"0\"><b>el punto</b><div class=\"back\">le point</div></div><div class=\"card flash\" tabindex=\"0\"><b>el guión</b><div class=\"back\">le tiret</div></div><div class=\"card flash\" tabindex=\"0\"><b>vivo</b><div class=\"back\">j’habite</div></div><div class=\"card flash\" tabindex=\"0\"><b>vives</b><div class=\"back\">tu habites</div></div><div class=\"card flash\" tabindex=\"0\"><b>vive</b><div class=\"back\">il/elle habite</div></div><div class=\"card flash\" tabindex=\"0\"><b>vivimos</b><div class=\"back\">nous habitons</div></div><div class=\"card flash\" tabindex=\"0\"><b>vivís</b><div class=\"back\">vous habitez</div></div><div class=\"card flash\" tabindex=\"0\"><b>viven</b><div class=\"back\">ils/elles habitent</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Dónde vives?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfD\\u00f3nde vives?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfD\\u00f3nde vives?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Vivo en Francia, en Paris.</b><div><button class=\"audio\" onclick=\"speak(\\\"Vivo en Francia, en Paris.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Vivo en Francia, en Paris.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cuál es tu número de móvil?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu n\\u00famero de m\\u00f3vil?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu n\\u00famero de m\\u00f3vil?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Mi número de móvil es cero, seis...</b><div><button class=\"audio\" onclick=\"speak(\\\"Mi n\\u00famero de m\\u00f3vil es cero, seis...\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Mi n\\u00famero de m\\u00f3vil es cero, seis...\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cuál es tu correo electrónico?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu correo electr\\u00f3nico?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu correo electr\\u00f3nico?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>correo</b><div><button class=\"audio\" onclick=\"speak(\\\"correo\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"correo\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Juana</b><div><button class=\"audio\" onclick=\"speak(\\\"Juana\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Juana\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>arroba</b><div><button class=\"audio\" onclick=\"speak(\\\"arroba\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"arroba\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>teléfono fijo</b><div><button class=\"audio\" onclick=\"speak(\\\"tel\\u00e9fono fijo\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"tel\\u00e9fono fijo\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Argentina</b><div><button class=\"audio\" onclick=\"speak(\\\"Argentina\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Argentina\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Rodrigo</b><div><button class=\"audio\" onclick=\"speak(\\\"Rodrigo\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Rodrigo\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>jota</b><div><button class=\"audio\" onclick=\"speak(\\\"jota\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"jota\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. ¿Dónde ___ tú? (vivir)</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"vives\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Yo ___ en Francia.</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"vivo\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Juana ___ en Venezuela.</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"vive\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Mis amigos ___ en México.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"viven\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Nosotros ___ en Madrid.</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"vivimos\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Vosotros ___ en Barcelona.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"vivís\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. « téléphone portable » →</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"el móvil\", \"móvil\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. « adresse mail » →</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"el correo electrónico\", \"correo electrónico\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. « @ » →</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"la arroba\", \"arroba\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. « point » →</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"el punto\", \"punto\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. « tiret » →</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"el guión\", \"guión\", \"guion\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. « ville » →</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"la ciudad\", \"ciudad\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : J’habite en France.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Vivo en Francia.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Où habites-tu ?</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"¿Dónde vives?\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Quel est ton numéro de portable ?</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"¿Cuál es tu número de móvil?\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Quelle est ton adresse mail ?</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"¿Cuál es tu correo electrónico?\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 9</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Où habites-tu ? » :\", \"a\": [\"¿De dónde eres?\", \"¿Dónde vives?\", \"¿Dónde eres?\", \"¿Cuál vives?\"], \"good\": 1}, {\"q\": \"VIVIR avec yo :\", \"a\": [\"vivo\", \"vives\", \"vive\", \"vivimos\"], \"good\": 0}, {\"q\": \"VIVIR avec ellos :\", \"a\": [\"vivís\", \"viven\", \"vive\", \"vivimos\"], \"good\": 1}, {\"q\": \"Après VIVIR, la préposition de lieu travaillée est :\", \"a\": [\"de\", \"en\", \"a\", \"por\"], \"good\": 1}, {\"q\": \"« le portable » :\", \"a\": [\"el teléfono fijo\", \"el móvil\", \"el correo\", \"el país\"], \"good\": 1}, {\"q\": \"« l’adresse mail » :\", \"a\": [\"el correo electrónico\", \"la ciudad\", \"el móvil\", \"el punto\"], \"good\": 0}, {\"q\": \"« @ » se dit :\", \"a\": [\"punto\", \"guión\", \"arroba\", \"correo\"], \"good\": 2}, {\"q\": \"« . » se dit :\", \"a\": [\"punto\", \"arroba\", \"guión\", \"móvil\"], \"good\": 0}, {\"q\": \"« - » se dit :\", \"a\": [\"arroba\", \"punto\", \"guión\", \"país\"], \"good\": 2}, {\"q\": \"« la ciudad » :\", \"a\": [\"le pays\", \"la ville\", \"le numéro\", \"l’adresse\"], \"good\": 1}, {\"q\": \"Question pour demander le mail :\", \"a\": [\"¿Cuál es tu correo electrónico?\", \"¿Dónde es tu correo?\", \"¿Qué correo vives?\", \"¿Cómo correo?\"], \"good\": 0}, {\"q\": \"Mots de prononciation de la séance :\", \"a\": [\"correo, Juana, arroba, Argentina, Rodrigo, jota\", \"Laura, Eulalia, Aurelia\", \"zapatito, azul, dieciséis\", \"woman, women\"], \"good\": 0}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}]};
  function openEmbeddedCourse(key,index){

  function activeWeek(){for(const w of [48,49,50,51]){if(!weekStats(w).complete)return w}return 51}

      <details class="archive-unit"><summary>Unités terminées · archives</summary><p>${esc(c.archiveTitle)} — conservée comme unité acquise. Les anciens cours pourront être réaffichés si nécessaire.</p></details>`;

    }
    content.innerHTML=`<section class="course-panel"><div class="course-title"><span class="subject-icon">${subjectIcon(key)}</span><div><h2>${s.name}</h2><p>${c?c.line:'Espace prêt pour les prochains cours'}</p></div></div>${body}</section>`;
    content.querySelector('#backSubjects')?.addEventListener('click',()=>{title.textContent='Mes matières';renderSubjects()});
    content.querySelectorAll('[data-open-course]').forEach(b=>b.addEventListener('click',()=>openEmbeddedCourse(key,Number(b.dataset.openCourse))));
  }

  function checkedCountsBySubject(){
    const counts={};subjects.forEach(s=>counts[s.key]=0);
    Object.keys(liveWeeks).map(Number).forEach(w=>{const saved=loadWeekProgress(w);liveWeeks[w].groups.forEach((g,d)=>g.items.forEach((item,i)=>{if(!saved[`${d}-${i}`])return;const key=item[0];if(counts[key]!==undefined)counts[key]+=taskWeight(item[2]);else if(key==='histoire')counts.histoire+=taskWeight(item[2])}))});
    return counts;
  }
  function renderProgression(){
    const added=checkedCountsBySubject();
    content.innerHTML=`<div class="section-head"><div><h2>Ma progression annuelle</h2><p>Les unités déjà terminées avant la semaine 48 sont intégrées dans le point de départ.</p></div></div><div class="progress-grid">${subjects.map(s=>{if(!annualTotals[s.key])return `<article class="progress-card"><div class="progress-card-head"><span class="subject-icon">${subjectIcon(s.key)}</span><div><strong>${s.name}</strong><span>Progression annuelle à configurer lors de l’ajout des cours</span></div><b class="progress-number">—</b></div><div class="progress-track"><span style="width:0"></span></div><div class="progress-foot">SVT et Sciences physiques seront intégrées dès réception de leur programme.</div></article>`;const done=Math.min(annualTotals[s.key],(baselineDone[s.key]||0)+(added[s.key]||0));const pct=Math.round(done/annualTotals[s.key]*100);return `<article class="progress-card"><div class="progress-card-head"><span class="subject-icon">${subjectIcon(s.key)}</span><div><strong>${s.name}</strong><span>${done} / ${annualTotals[s.key]} activités comptabilisées</span></div><b class="progress-number">${pct}%</b></div><div class="progress-track"><span style="width:${pct}%"></span></div><div class="progress-foot">Mise à jour automatique avec les cases cochées du planning.</div></article>`}).join('')}</div>`;
  }

  function gradeKey(){return `${STORAGE_PREFIX}-grades`}
  function grades(){return loadJSON(gradeKey(),[])}
  function saveGrades(list){saveJSON(gradeKey(),list)}
  function avg(nums){return nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null}
  function fmt(n){return n===null?'—':n.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:2})}
  function subjectAverage(list,key,term){return avg(list.filter(g=>g.subject===key&&g.term===term).map(g=>g.score))}
  function termGeneral(list,term){const avgs=subjects.map(s=>subjectAverage(list,s.key,term)).filter(x=>x!==null);return avg(avgs)}
  function renderNotes(){
    const list=grades();const general=termGeneral(list,selectedTerm);
    content.innerHTML=`<div class="section-head"><div><h2>Mes notes</h2><p>Une matière, une note sur 20. Aucun numéro de devoir, aucun coefficient.</p></div></div><div class="term-tabs"><button class="term-btn ${selectedTerm===1?'active':''}" data-term="1">Trimestre 1</button><button class="term-btn ${selectedTerm===2?'active':''}" data-term="2">Trimestre 2</button><button class="term-btn ${selectedTerm===3?'active':''}" data-term="3">Trimestre 3</button><button class="term-btn ${selectedTerm===4?'active':''}" data-term="4">Moyenne annuelle</button></div>${selectedTerm===4?renderAnnualGrades(list):`<div class="grade-summary"><div><span>Moyenne générale · trimestre ${selectedTerm}</span><strong>${fmt(general)}${general===null?'':' /20'}</strong></div><span>${list.filter(g=>g.term===selectedTerm).length} note(s)</span></div><div class="grade-list">${subjects.map(s=>{const own=list.filter(g=>g.term===selectedTerm&&g.subject===s.key),a=subjectAverage(list,s.key,selectedTerm);return `<div class="grade-row"><div class="grade-subject"><span class="subject-icon">${subjectIcon(s.key)}</span><strong>${s.name}</strong></div><div class="grade-chips">${own.length?own.map(g=>`<span class="grade-chip">${fmt(g.score)}<button aria-label="Supprimer" data-delete-grade="${g.id}">×</button></span>`).join(''):'<span style="color:#8b9aa5;font-size:11px">Aucune note</span>'}</div><div class="grade-add"><input type="number" min="0" max="20" step="0.25" placeholder="/20" data-grade-input="${s.key}"><button class="tiny-btn" data-add-grade="${s.key}">+</button></div><div class="grade-average">${a===null?'—':fmt(a)+'/20'}</div></div>`}).join('')}</div>`}`;
    content.querySelectorAll('[data-term]').forEach(b=>b.addEventListener('click',()=>{selectedTerm=Number(b.dataset.term);renderNotes()}));
    content.querySelectorAll('[data-add-grade]').forEach(b=>b.addEventListener('click',()=>addGrade(b.dataset.addGrade)));
    content.querySelectorAll('[data-grade-input]').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addGrade(inp.dataset.gradeInput)}}));
    content.querySelectorAll('[data-delete-grade]').forEach(b=>b.addEventListener('click',()=>{const next=grades().filter(g=>g.id!==b.dataset.deleteGrade);saveGrades(next);renderNotes()}));
  }
  function addGrade(subject){const inp=content.querySelector(`[data-grade-input="${subject}"]`);const score=Number(inp.value);if(!Number.isFinite(score)||score<0||score>20){toast('Entre une note comprise entre 0 et 20.');return}const list=grades();list.push({id:crypto.randomUUID(),subject,term:selectedTerm,score});saveGrades(list);renderNotes()}
  function renderAnnualGrades(list){
    const terms=[1,2,3].map(t=>termGeneral(list,t));const ready=terms.every(x=>x!==null);const annual=ready?avg(terms):avg(terms.filter(x=>x!==null));
    return `<div class="grade-summary"><div><span>${ready?'Moyenne annuelle des 3 trimestres':'Moyenne annuelle provisoire'}</span><strong>${fmt(annual)}${annual===null?'':' /20'}</strong></div><span>${ready?'3 trimestres renseignés':'Calcul final dès que les 3 trimestres ont des notes'}</span></div><table class="annual-table"><thead><tr><th>Matière</th><th>T1</th><th>T2</th><th>T3</th><th>Année</th></tr></thead><tbody>${subjects.map(s=>{const vals=[1,2,3].map(t=>subjectAverage(list,s.key,t));const av=vals.every(x=>x===null)?null:avg(vals.filter(x=>x!==null));return `<tr><td><b>${s.name}</b></td><td>${fmt(vals[0])}</td><td>${fmt(vals[1])}</td><td>${fmt(vals[2])}</td><td>${fmt(av)}</td></tr>`}).join('')}</tbody></table>`;
  }

  function toast(msg){const old=document.querySelector('.toast');old?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)}
  document.querySelector('#backupBtn').addEventListener('click',()=>{
    const data={version:1,year:YEAR_ID,exportedAt:new Date().toISOString(),grades:grades(),weeks:{}};[48,49,50,51].forEach(w=>data.weeks[w]=loadWeekProgress(w));
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CNED-NOEE-sauvegarde-${YEAR_ID}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde téléchargée.');
  });

  setView('planning');
})();
</script>
</body>
</html>

"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris en lettres : 14</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"catorce\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Mon ami a onze ans.</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"Mi amigo tiene once años.\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Nous avons treize ans.</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"Tenemos trece años.\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 4</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Quel âge as-tu ? » :\", \"a\": [\"¿Cuántos años tienes?\", \"¿Cuándo es tu cumpleaños?\", \"¿Quién eres?\", \"¿Qué lengua hablas?\"], \"good\": 0}, {\"q\": \"« J’ai 12 ans » :\", \"a\": [\"Soy doce años.\", \"Tengo doce años.\", \"Me llamo doce años.\", \"Vivo doce años.\"], \"good\": 1}, {\"q\": \"TENER avec « yo » :\", \"a\": [\"tengo\", \"tienes\", \"tiene\", \"tenemos\"], \"good\": 0}, {\"q\": \"TENER avec « vosotros » :\", \"a\": [\"tenéis\", \"tenemos\", \"tienen\", \"tienes\"], \"good\": 0}, {\"q\": \"TENER avec « ellos » :\", \"a\": [\"tiene\", \"tenéis\", \"tienen\", \"tengo\"], \"good\": 2}, {\"q\": \"23 se dit :\", \"a\": [\"veintidós\", \"veintitrés\", \"veinticuatro\", \"treinta y tres\"], \"good\": 1}, {\"q\": \"16 se dit :\", \"a\": [\"dieciséis\", \"diecisiete\", \"seis\", \"catorce\"], \"good\": 0}, {\"q\": \"31 se dit :\", \"a\": [\"treinta uno\", \"treinta y uno\", \"treintauno\", \"veintiuno\"], \"good\": 1}, {\"q\": \"Le diminutif de zapato :\", \"a\": [\"zapatito\", \"zapatillo\", \"zapatita\", \"zapatico\"], \"good\": 0}, {\"q\": \"Le diminutif affectueux de Pablo :\", \"a\": [\"Pablito\", \"Pablita\", \"Pablillo\", \"Pablón\"], \"good\": 0}, {\"q\": \"« la edad » signifie :\", \"a\": [\"la date\", \"l’âge\", \"l’école\", \"la ville\"], \"good\": 1}, {\"q\": \"Dans le travail phonologique du CNED, Z et C devant E/I sont associés au son :\", \"a\": [\"[s]\", \"[θ]\", \"[r]\", \"[x]\"], \"good\": 1}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 5", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 5</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 5 - Autoevaluación</h1><p>Bilan actif des séances 1 à 4</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Choisir entre LLAMARSE, SER et TENER</label><br><label><input type=\"checkbox\"> Réviser les questions essentielles</label><br><label><input type=\"checkbox\"> Réviser articles et accords</label><br><label><input type=\"checkbox\"> Réviser nom, âge, origine et nationalité</label><br><label><input type=\"checkbox\"> Faire un mini devoir sans regarder le cours</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>Les 4 questions essentielles</h3><p>¿Cómo te llamas?<br>¿Quién eres?<br>¿De dónde eres?<br>¿Cuántos años tienes?</p></div><div class=\"card\"><h3>Les 3 verbes</h3><p>LLAMARSE : me llamo...<br>SER : soy... / soy de...<br>TENER : tengo... años</p></div><div class=\"card\"><h3>Accords</h3><p>un niño ↔ una niña ; un amigo ↔ amigos ; la alumna ↔ las alumnas</p></div><div class=\"card\"><h3>Objectif</h3><p>Comprendre une présentation et être capable de se présenter avec nom, âge, origine et nationalité.</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>me llamo</b><div class=\"back\">je m’appelle</div></div><div class=\"card flash\" tabindex=\"0\"><b>soy</b><div class=\"back\">je suis</div></div><div class=\"card flash\" tabindex=\"0\"><b>soy de</b><div class=\"back\">je viens de</div></div><div class=\"card flash\" tabindex=\"0\"><b>tengo</b><div class=\"back\">j’ai</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Cómo?</b><div class=\"back\">comment ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Quién?</b><div class=\"back\">qui ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿De dónde?</b><div class=\"back\">d’où ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Cuántos?</b><div class=\"back\">combien ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>un niño</b><div class=\"back\">un garçon</div></div><div class=\"card flash\" tabindex=\"0\"><b>una niña</b><div class=\"back\">une fille</div></div><div class=\"card flash\" tabindex=\"0\"><b>un amigo</b><div class=\"back\">un ami</div></div><div class=\"card flash\" tabindex=\"0\"><b>una amiga</b><div class=\"back\">une amie</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>Me llamo Noée.</b><div><button class=\"audio\" onclick=\"speak(\\\"Me llamo No\\u00e9e.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Me llamo No\\u00e9e.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy una alumna.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy una alumna.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy una alumna.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy de Francia.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy de Francia.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy de Francia.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy francesa.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy francesa.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy francesa.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Tengo doce años.</b><div><button class=\"audio\" onclick=\"speak(\\\"Tengo doce a\\u00f1os.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Tengo doce a\\u00f1os.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cómo te llamas?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo te llamas?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo te llamas?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Quién eres?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n eres?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n eres?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿De dónde eres?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfDe d\\u00f3nde eres?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfDe d\\u00f3nde eres?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cuántos años tienes?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tienes?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tienes?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Mi amigo ___ Esteban. (llamarse)</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"se llama\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Yo ___ doce años. (tener)</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"tengo\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Y tú, ¿quién ___? (ser)</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"eres\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Nosotros ___ amigos. (ser)</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"somos\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Mis amigas ___ trece años. (tener)</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"tienen\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Ellas ___ Paulina y Eulalia. (llamarse)</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"se llaman\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. un niño → féminin :</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"una niña\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. una señora → masculin :</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"un señor\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. un amigo → pluriel :</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"amigos\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. la alumna → pluriel :</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"las alumnas\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. ___ profesores (article défini)</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"los\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. ___ amiga (article indéfini)</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"una\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Écris une mini-présentation de 4 phrases.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Me llamo ... / Soy ... / Soy de ... / Tengo ... años.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Remets dans l’ordre : Me llamo Estrella / Tengo quince años / Soy de España.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Me llamo Estrella. Tengo quince años. Soy de España.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Associe : ¿De dónde eres?</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"Soy de Perú.\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Associe : ¿Quién es?</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"Es mi amiga Sara.\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 5</footer></div>\n<script>const QUIZDATA=[{\"q\": \"Quelle question demande le prénom ?\", \"a\": [\"¿Quién eres?\", \"¿Cómo te llamas?\", \"¿De dónde eres?\", \"¿Cuántos años tienes?\"], \"good\": 1}, {\"q\": \"Quelle question demande l’origine ?\", \"a\": [\"¿De dónde eres?\", \"¿Dónde vives?\", \"¿Cómo estás?\", \"¿Cuál es tu signo?\"], \"good\": 0}, {\"q\": \"Quelle question demande l’âge ?\", \"a\": [\"¿Qué lengua hablas?\", \"¿Cuándo es tu cumpleaños?\", \"¿Cuántos años tienes?\", \"¿Quién eres?\"], \"good\": 2}, {\"q\": \"Pour dire son prénom :\", \"a\": [\"Me llamo Pablo.\", \"Soy de Pablo.\", \"Tengo Pablo.\", \"Vivo Pablo.\"], \"good\": 0}, {\"q\": \"Pour dire son âge :\", \"a\": [\"Soy doce años.\", \"Tengo doce años.\", \"Me llamo doce años.\", \"Soy de doce años.\"], \"good\": 1}, {\"q\": \"Pour dire son origine :\", \"a\": [\"Soy de Perú.\", \"Tengo Perú.\", \"Me llamo Perú.\", \"Soy peruano de.\"], \"good\": 0}, {\"q\": \"Pour dire sa nationalité si l’on est une fille du Pérou :\", \"a\": [\"Soy peruano.\", \"Soy peruana.\", \"Soy Perú.\", \"Tengo peruana.\"], \"good\": 1}, {\"q\": \"« Somos amigos » :\", \"a\": [\"Je suis un ami.\", \"Nous sommes amis.\", \"Ils sont amis.\", \"Vous êtes amis.\"], \"good\": 1}, {\"q\": \"Pluriel de « un amigo » :\", \"a\": [\"unos amigo\", \"amigos\", \"los amigo\", \"amigoes\"], \"good\": 1}, {\"q\": \"Féminin de « un niño » :\", \"a\": [\"una niña\", \"una niño\", \"un niña\", \"niñas\"], \"good\": 0}, {\"q\": \"Avec « mis amigas », LLAMARSE :\", \"a\": [\"se llama\", \"se llaman\", \"me llamo\", \"te llamas\"], \"good\": 1}, {\"q\": \"Avec « vosotros », TENER :\", \"a\": [\"tenéis\", \"tienen\", \"tenemos\", \"tienes\"], \"good\": 0}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 6", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 6</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 6 - ¿Cuándo es tu cumpleaños?</h1><p>Dire sa date d’anniversaire et parler de l’anniversaire</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Utiliser ¿Cuándo?</label><br><label><input type=\"checkbox\"> Exprimer une date avec de</label><br><label><input type=\"checkbox\"> Conjuguer CUMPLIR</label><br><label><input type=\"checkbox\"> Réviser les mois et les nombres</label><br><label><input type=\"checkbox\"> Connaître le vocabulaire de l’anniversaire et la quinceañera</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>La date</h3><p>18/09 = dieciocho de septiembre<br>On met DE entre le nombre et le mois.</p></div><div class=\"card\"><h3>Anniversaire</h3><p>¿Cuándo es tu cumpleaños?<br>Mi cumpleaños es el dos de marzo.</p></div><div class=\"card\"><h3>CUMPLIR</h3><p>cumplo | cumples | cumple | cumplimos | cumplís | cumplen</p></div><div class=\"card\"><h3>Âge fêté</h3><p>¿Cuántos años cumples?<br>Cumplo doce años.</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>el cumpleaños</b><div class=\"back\">l’anniversaire</div></div><div class=\"card flash\" tabindex=\"0\"><b>¡Cumpleaños feliz!</b><div class=\"back\">Joyeux anniversaire !</div></div><div class=\"card flash\" tabindex=\"0\"><b>cumplir años</b><div class=\"back\">fêter un certain nombre d’années</div></div><div class=\"card flash\" tabindex=\"0\"><b>una fiesta</b><div class=\"back\">une fête</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Cuándo?</b><div class=\"back\">Quand ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>enero</b><div class=\"back\">janvier</div></div><div class=\"card flash\" tabindex=\"0\"><b>febrero</b><div class=\"back\">février</div></div><div class=\"card flash\" tabindex=\"0\"><b>marzo</b><div class=\"back\">mars</div></div><div class=\"card flash\" tabindex=\"0\"><b>abril</b><div class=\"back\">avril</div></div><div class=\"card flash\" tabindex=\"0\"><b>mayo</b><div class=\"back\">mai</div></div><div class=\"card flash\" tabindex=\"0\"><b>junio</b><div class=\"back\">juin</div></div><div class=\"card flash\" tabindex=\"0\"><b>julio</b><div class=\"back\">juillet</div></div><div class=\"card flash\" tabindex=\"0\"><b>agosto</b><div class=\"back\">août</div></div><div class=\"card flash\" tabindex=\"0\"><b>septiembre</b><div class=\"back\">septembre</div></div><div class=\"card flash\" tabindex=\"0\"><b>octubre</b><div class=\"back\">octobre</div></div><div class=\"card flash\" tabindex=\"0\"><b>noviembre</b><div class=\"back\">novembre</div></div><div class=\"card flash\" tabindex=\"0\"><b>diciembre</b><div class=\"back\">décembre</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Cuándo es tu cumpleaños?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ndo es tu cumplea\\u00f1os?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ndo es tu cumplea\\u00f1os?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Mi cumpleaños es el dos de marzo.</b><div><button class=\"audio\" onclick=\"speak(\\\"Mi cumplea\\u00f1os es el dos de marzo.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Mi cumplea\\u00f1os es el dos de marzo.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cuántos años cumples?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os cumples?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os cumples?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Cumplo doce años.</b><div><button class=\"audio\" onclick=\"speak(\\\"Cumplo doce a\\u00f1os.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Cumplo doce a\\u00f1os.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Cumpleaños feliz.</b><div><button class=\"audio\" onclick=\"speak(\\\"Cumplea\\u00f1os feliz.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Cumplea\\u00f1os feliz.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>enero, febrero, marzo, abril</b><div><button class=\"audio\" onclick=\"speak(\\\"enero, febrero, marzo, abril\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"enero, febrero, marzo, abril\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>mayo, junio, julio, agosto</b><div><button class=\"audio\" onclick=\"speak(\\\"mayo, junio, julio, agosto\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"mayo, junio, julio, agosto\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>septiembre, octubre, noviembre, diciembre</b><div><button class=\"audio\" onclick=\"speak(\\\"septiembre, octubre, noviembre, diciembre\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"septiembre, octubre, noviembre, diciembre\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. 18/09 → dieciocho ___ septiembre</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"de\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Mi cumpleaños ___ el dos de marzo.</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"es\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. ¿___ es tu cumpleaños?</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"cuándo\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Yo ___ doce años. (cumplir)</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"cumplo\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Tú ___ trece años.</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"cumples\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Dolores ___ quince años.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"cumple\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. Nosotros ___ catorce años.</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"cumplimos\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. Vosotros ___ dieciséis años.</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"cumplís\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. Ellos ___ doce años.</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"cumplen\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. 02/03 →</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"dos de marzo\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. 24/10 →</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"veinticuatro de octubre\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. 15/01 →</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"quince de enero\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Quand est ton anniversaire ?</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"¿Cuándo es tu cumpleaños?\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Mon anniversaire est le 16 novembre.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Mi cumpleaños es el dieciséis de noviembre.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris 31/12 en lettres.</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"treinta y uno de diciembre\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Je fête mes douze ans.</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"Cumplo doce años.\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 6</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Quand est ton anniversaire ? » :\", \"a\": [\"¿Cuándo es tu cumpleaños?\", \"¿Cuántos años tienes?\", \"¿Cuál es tu signo?\", \"¿Qué lengua hablas?\"], \"good\": 0}, {\"q\": \"Dans une date, entre le nombre et le mois on met :\", \"a\": [\"en\", \"de\", \"a\", \"y\"], \"good\": 1}, {\"q\": \"« Mon anniversaire est le 2 mars » :\", \"a\": [\"Mi cumpleaños es dos marzo.\", \"Mi cumpleaños es el dos de marzo.\", \"Tengo el dos marzo.\", \"Cumplo marzo dos.\"], \"good\": 1}, {\"q\": \"CUMPLIR avec yo :\", \"a\": [\"cumplo\", \"cumples\", \"cumple\", \"cumplimos\"], \"good\": 0}, {\"q\": \"CUMPLIR avec ellos :\", \"a\": [\"cumplís\", \"cumplen\", \"cumple\", \"cumplimos\"], \"good\": 1}, {\"q\": \"« una fiesta » :\", \"a\": [\"une date\", \"une fête\", \"un mois\", \"un âge\"], \"good\": 1}, {\"q\": \"« ¿Cuándo? » :\", \"a\": [\"quand ?\", \"combien ?\", \"qui ?\", \"quel ?\"], \"good\": 0}, {\"q\": \"Septembre :\", \"a\": [\"septiembre\", \"setiembreo\", \"septembro\", \"september\"], \"good\": 0}, {\"q\": \"Janvier :\", \"a\": [\"enero\", \"enero de\", \"janero\", \"febrero\"], \"good\": 0}, {\"q\": \"Décembre :\", \"a\": [\"noviembre\", \"diciembre\", \"octubre\", \"enero\"], \"good\": 1}, {\"q\": \"« Cumplo doce años » signifie :\", \"a\": [\"J’ai 12 ans\", \"Je fête mes 12 ans\", \"J’aurai 12 ans demain\", \"Je m’appelle Doce\"], \"good\": 1}, {\"q\": \"Le thème culturel associé est :\", \"a\": [\"la quinceañera\", \"le tango\", \"Mount Rushmore\", \"Apollo 11\"], \"good\": 0}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 7", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 7</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 7 - ¿Cuál es tu signo?</h1><p>Dire son signe, ses qualités et construire une phrase négative</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Utiliser ¿Cuál?</label><br><label><input type=\"checkbox\"> Mémoriser les signes astrologiques</label><br><label><input type=\"checkbox\"> Exprimer quelques qualités</label><br><label><input type=\"checkbox\"> Utiliser pero</label><br><label><input type=\"checkbox\"> Former une négation avec no + verbe</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>Signe</h3><p>¿Cuál es tu signo?<br>Soy acuario.<br>¿Cuál es el signo de Lola? Lola es escorpio.</p></div><div class=\"card\"><h3>Qualités</h3><p>¿Cómo es Víctor?<br>Víctor es honesto.</p></div><div class=\"card\"><h3>Négation</h3><p>no + verbe : Víctor no es apasionado.</p></div><div class=\"card\"><h3>PERO</h3><p>Víctor es honesto pero no es apasionado. = Víctor est honnête mais il n’est pas passionné.</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>Aries</b><div class=\"back\">Bélier</div></div><div class=\"card flash\" tabindex=\"0\"><b>Tauro</b><div class=\"back\">Taureau</div></div><div class=\"card flash\" tabindex=\"0\"><b>Géminis</b><div class=\"back\">Gémeaux</div></div><div class=\"card flash\" tabindex=\"0\"><b>Cáncer</b><div class=\"back\">Cancer</div></div><div class=\"card flash\" tabindex=\"0\"><b>Leo</b><div class=\"back\">Lion</div></div><div class=\"card flash\" tabindex=\"0\"><b>Virgo</b><div class=\"back\">Vierge</div></div><div class=\"card flash\" tabindex=\"0\"><b>Libra</b><div class=\"back\">Balance</div></div><div class=\"card flash\" tabindex=\"0\"><b>Escorpio</b><div class=\"back\">Scorpion</div></div><div class=\"card flash\" tabindex=\"0\"><b>Sagitario</b><div class=\"back\">Sagittaire</div></div><div class=\"card flash\" tabindex=\"0\"><b>Capricornio</b><div class=\"back\">Capricorne</div></div><div class=\"card flash\" tabindex=\"0\"><b>Acuario</b><div class=\"back\">Verseau</div></div><div class=\"card flash\" tabindex=\"0\"><b>Piscis</b><div class=\"back\">Poisson</div></div><div class=\"card flash\" tabindex=\"0\"><b>enérgico/a</b><div class=\"back\">énergique</div></div><div class=\"card flash\" tabindex=\"0\"><b>fiel</b><div class=\"back\">fidèle</div></div><div class=\"card flash\" tabindex=\"0\"><b>apasionado/a</b><div class=\"back\">passionné/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>honesto/a</b><div class=\"back\">honnête</div></div><div class=\"card flash\" tabindex=\"0\"><b>paciente</b><div class=\"back\">patient/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>optimista</b><div class=\"back\">optimiste</div></div><div class=\"card flash\" tabindex=\"0\"><b>curioso/a</b><div class=\"back\">curieux/se</div></div><div class=\"card flash\" tabindex=\"0\"><b>tranquilo/a</b><div class=\"back\">calme</div></div><div class=\"card flash\" tabindex=\"0\"><b>sensible</b><div class=\"back\">sensible</div></div><div class=\"card flash\" tabindex=\"0\"><b>exigente</b><div class=\"back\">exigeant/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>valiente</b><div class=\"back\">courageux/se</div></div><div class=\"card flash\" tabindex=\"0\"><b>amistoso/a</b><div class=\"back\">amical/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>generoso/a</b><div class=\"back\">généreux/se</div></div><div class=\"card flash\" tabindex=\"0\"><b>creativo/a</b><div class=\"back\">créatif/ve</div></div><div class=\"card flash\" tabindex=\"0\"><b>inteligente</b><div class=\"back\">intelligent/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>comprensivo/a</b><div class=\"back\">compréhensif/ve</div></div><div class=\"card flash\" tabindex=\"0\"><b>pero</b><div class=\"back\">mais</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Cuál?</b><div class=\"back\">quel ?</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Cuál es tu signo?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu signo?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1l es tu signo?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy acuario.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy acuario.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy acuario.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Lola es escorpio.</b><div><button class=\"audio\" onclick=\"speak(\\\"Lola es escorpio.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Lola es escorpio.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cómo es Víctor?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo es V\\u00edctor?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo es V\\u00edctor?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Víctor es honesto.</b><div><button class=\"audio\" onclick=\"speak(\\\"V\\u00edctor es honesto.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"V\\u00edctor es honesto.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Víctor no es apasionado.</b><div><button class=\"audio\" onclick=\"speak(\\\"V\\u00edctor no es apasionado.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"V\\u00edctor no es apasionado.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Víctor es honesto pero no es apasionado.</b><div><button class=\"audio\" onclick=\"speak(\\\"V\\u00edctor es honesto pero no es apasionado.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"V\\u00edctor es honesto pero no es apasionado.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy curioso y creativo.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy curioso y creativo.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy curioso y creativo.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy tranquila y paciente.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy tranquila y paciente.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy tranquila y paciente.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. ¿___ es tu signo?</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"cuál\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Soy ___. (Verseau)</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"acuario\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Lola es ___. (Scorpion)</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"escorpio\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Víctor ___ honesto.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"es\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Víctor ___ es apasionado.</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"no\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Es honesto ___ no es apasionado.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"pero\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. una chica creativo →</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"creativa\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. un chico generosa →</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"generoso\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. una chica valiente →</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"valiente\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. un chico inteligente →</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"inteligente\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. « mais » →</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"pero\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. « ne...pas » →</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"no\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Je suis Verseau.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Soy acuario.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Elle est honnête mais elle n’est pas patiente.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Es honesta pero no es paciente.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Comment est Víctor ?</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"¿Cómo es Víctor?\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris deux qualités avec « Soy ».</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"Soy ... y ... .\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 7</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Quel est ton signe ? » :\", \"a\": [\"¿Cuál es tu signo?\", \"¿Qué signo hablas?\", \"¿Cuándo es tu signo?\", \"¿Quién es tu signo?\"], \"good\": 0}, {\"q\": \"Verseau :\", \"a\": [\"Acuario\", \"Piscis\", \"Libra\", \"Virgo\"], \"good\": 0}, {\"q\": \"Scorpion :\", \"a\": [\"Sagitario\", \"Escorpio\", \"Cáncer\", \"Tauro\"], \"good\": 1}, {\"q\": \"« fidèle » :\", \"a\": [\"fiel\", \"valiente\", \"paciente\", \"amistoso\"], \"good\": 0}, {\"q\": \"« courageux » :\", \"a\": [\"valiente\", \"sensible\", \"optimista\", \"exigente\"], \"good\": 0}, {\"q\": \"« honnête » :\", \"a\": [\"honesto\", \"creativo\", \"curioso\", \"tranquilo\"], \"good\": 0}, {\"q\": \"Pour dire « mais » :\", \"a\": [\"y\", \"pero\", \"no\", \"e\"], \"good\": 1}, {\"q\": \"La négation se place :\", \"a\": [\"après le nom\", \"avant le verbe\", \"après le verbe\", \"à la fin\"], \"good\": 1}, {\"q\": \"Phrase correcte :\", \"a\": [\"Víctor es no apasionado.\", \"Víctor no es apasionado.\", \"No Víctor es apasionado.\", \"Víctor es apasionado no.\"], \"good\": 1}, {\"q\": \"« ¿Cómo es Víctor? » demande :\", \"a\": [\"son âge\", \"ses qualités / comment il est\", \"son signe seulement\", \"son adresse\"], \"good\": 1}, {\"q\": \"Féminin de creativo :\", \"a\": [\"creativa\", \"creativo\", \"creativas\", \"creativae\"], \"good\": 0}, {\"q\": \"« optimista » est :\", \"a\": [\"uniquement masculin\", \"uniquement féminin\", \"identique au masculin et au féminin\", \"un verbe\"], \"good\": 2}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 8", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 8</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 8 - ¿Qué lengua hablas?</h1><p>Dire les langues que l’on parle et que l’on apprend</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Conjuguer HABLAR</label><br><label><input type=\"checkbox\"> Conjuguer APRENDER</label><br><label><input type=\"checkbox\"> Utiliser ¿Qué lengua...?</label><br><label><input type=\"checkbox\"> Employer y / e devant le son [i]</label><br><label><input type=\"checkbox\"> Connaître plusieurs langues parlées en Espagne</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>HABLAR</h3><p>hablo | hablas | habla | hablamos | habláis | hablan</p></div><div class=\"card\"><h3>APRENDER</h3><p>aprendo | aprendes | aprende | aprendemos | aprendéis | aprenden</p></div><div class=\"card\"><h3>Questions</h3><p>¿Qué lengua hablas? = Quelle langue parles-tu ?<br>¿Qué lengua aprendes? = Quelle langue apprends-tu ?</p></div><div class=\"card\"><h3>Y / E</h3><p>y = et ; devant le son [i], y devient e : inglés y ruso mais ruso e inglés</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>una lengua</b><div class=\"back\">une langue</div></div><div class=\"card flash\" tabindex=\"0\"><b>el francés</b><div class=\"back\">le français</div></div><div class=\"card flash\" tabindex=\"0\"><b>el inglés</b><div class=\"back\">l’anglais</div></div><div class=\"card flash\" tabindex=\"0\"><b>el portugués</b><div class=\"back\">le portugais</div></div><div class=\"card flash\" tabindex=\"0\"><b>el italiano</b><div class=\"back\">l’italien</div></div><div class=\"card flash\" tabindex=\"0\"><b>el griego</b><div class=\"back\">le grec</div></div><div class=\"card flash\" tabindex=\"0\"><b>el ruso</b><div class=\"back\">le russe</div></div><div class=\"card flash\" tabindex=\"0\"><b>el árabe</b><div class=\"back\">l’arabe</div></div><div class=\"card flash\" tabindex=\"0\"><b>el castellano / español</b><div class=\"back\">le castillan / espagnol</div></div><div class=\"card flash\" tabindex=\"0\"><b>el catalán</b><div class=\"back\">le catalan</div></div><div class=\"card flash\" tabindex=\"0\"><b>el gallego</b><div class=\"back\">le galicien</div></div><div class=\"card flash\" tabindex=\"0\"><b>el euskera / vasco</b><div class=\"back\">le basque</div></div><div class=\"card flash\" tabindex=\"0\"><b>el valenciano</b><div class=\"back\">le valencien</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Qué?</b><div class=\"back\">quel/le(s) ?</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Qué lengua hablas?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfQu\\u00e9 lengua hablas?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfQu\\u00e9 lengua hablas?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Hablo francés.</b><div><button class=\"audio\" onclick=\"speak(\\\"Hablo franc\\u00e9s.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Hablo franc\\u00e9s.\\\",true)\">🐢 Lent</button></div><div class=\"mini

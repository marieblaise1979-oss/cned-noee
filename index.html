<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f4c81" />
  <title>CNED NOEE — Mon espace de travail</title>
  <style>:root{
  --navy:#073763;--blue:#0f5f9c;--blue2:#1d7fc1;--sky:#69c6ee;--ice:#eaf7ff;--paper:#fff;
  --ink:#17324a;--muted:#6b7f91;--line:#d8e8f3;--bg:#f4f9fc;--shadow:0 12px 35px rgba(7,55,99,.10);
  --good:#147a64;--due:#b54b59;--radius:22px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}.app-shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:20px 16px;background:linear-gradient(180deg,#eef9ff 0%,#dff3ff 100%);border-right:1px solid #cfe7f5;display:flex;flex-direction:column;gap:18px;z-index:5}.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid #cfe7f5}.brand img{width:78px;height:78px;object-fit:contain;border-radius:18px}.brand-copy{display:flex;flex-direction:column}.brand-copy strong{font-size:18px;color:var(--navy)}.brand-copy span{font-size:12px;color:var(--muted)}
.main-nav{display:grid;gap:10px}.nav-card{width:100%;border:1px solid transparent;background:rgba(255,255,255,.78);border-radius:18px;padding:10px 11px;display:grid;grid-template-columns:54px 1fr;align-items:center;text-align:left;gap:9px;color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(7,55,99,.04);transition:.18s}.nav-card:hover{transform:translateY(-1px);border-color:#a9d7ef}.nav-card.active{background:#fff;border-color:#75bfe5;box-shadow:0 9px 20px rgba(15,95,156,.12)}.nav-card strong,.nav-card small{display:block}.nav-card strong{font-size:14px;color:var(--navy)}.nav-card small{font-size:11px;color:var(--muted);margin-top:2px}.nav-icon svg{width:50px;height:50px;display:block}.year-box{margin-top:auto;background:rgba(255,255,255,.75);border:1px solid #cfe7f5;border-radius:17px;padding:12px 14px}.year-box span,.year-box small{display:block;color:var(--muted);font-size:11px}.year-box strong{font-size:14px;color:var(--navy);display:block;margin:2px 0}
.main-content{min-width:0;padding:0 30px 30px}.topbar{min-height:94px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px;position:sticky;top:0;background:rgba(244,249,252,.94);backdrop-filter:blur(12px);z-index:4}.eyebrow{margin:0;color:var(--blue2);font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:800}.topbar h1{margin:3px 0 0;font-size:26px;color:var(--navy)}.backup-btn,.soft-btn,.primary-btn,.week-btn,.term-btn,.tiny-btn{border:0;border-radius:12px;cursor:pointer}.backup-btn{background:#fff;border:1px solid var(--line);padding:10px 13px;color:var(--blue);font-weight:700;font-size:12px}.mobile-menu{display:none}.content{max-width:1280px;margin:0 auto}footer{max-width:1280px;margin:28px auto 0;color:var(--muted);font-size:11px;text-align:center}
.hero-week{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,#0b4f83,#187fbd 60%,#50b8e8);color:white;border-radius:26px;padding:24px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-week:after{content:"";position:absolute;right:-45px;top:-60px;width:210px;height:210px;border:28px solid rgba(255,255,255,.10);transform:rotate(35deg)}.hero-week h2{margin:0;font-size:26px}.hero-week p{margin:5px 0 0;color:#dff5ff}.week-progress{min-width:210px}.week-progress strong{display:flex;justify-content:space-between;font-size:13px}.meter{height:10px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:8px;overflow:hidden}.meter>span{height:100%;display:block;background:#fff;border-radius:99px;transition:width .25s}.complete-note{margin-top:8px;font-size:11px;color:#e7fbff}
.planning-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px;flex-wrap:wrap}.week-nav{display:flex;gap:8px;align-items:center}.week-btn,.soft-btn{background:#fff;border:1px solid var(--line);padding:9px 12px;color:var(--blue);font-weight:700;font-size:12px}.week-btn:disabled{opacity:.4;cursor:not-allowed}.week-select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.day{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(7,55,99,.05)}.day-head{padding:14px 15px;background:linear-gradient(180deg,#f5fbff,#edf8fe);border-bottom:1px solid var(--line)}.day-head h3{margin:0;color:var(--navy);font-size:16px}.day-head span{color:var(--muted);font-size:11px}.tasks{padding:10px;display:grid;gap:8px}.task{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:10px;border-radius:13px;background:#f8fbfd;border:1px solid #edf3f7;cursor:pointer}.task:hover{border-color:#a9d7ef}.task.done{opacity:.58;background:#eef8f4}.task.done .task-title,.task.done .task-detail{text-decoration:line-through}.task input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue2)}.task-title{font-weight:800;font-size:12px;color:var(--navy)}.task-detail{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}.task.due{border-left:4px solid #e07a86}.task.college{border-left:4px solid #8e9ba5}.empty-day{color:var(--muted);font-size:12px;padding:8px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px}.section-head h2{margin:0;color:var(--navy);font-size:23px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.subject-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px}.subject-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;cursor:pointer;text-align:left;box-shadow:0 6px 17px rgba(7,55,99,.05);transition:.18s}.subject-card:hover{transform:translateY(-2px);border-color:#82c8e9}.subject-card .subject-icon svg{width:68px;height:68px}.subject-card strong{display:block;margin-top:9px;font-size:15px;color:var(--navy)}.subject-card small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.subject-card .state{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:99px;background:var(--ice);color:var(--blue);font-size:10px;font-weight:800}.subject-card .state.soon{background:#f0f2f4;color:#798590}
.course-panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.course-title{display:flex;align-items:center;gap:14px}.course-title .subject-icon svg{width:76px;height:76px}.course-title h2{margin:0;color:var(--navy)}.course-title p{margin:4px 0 0;color:var(--muted)}.course-actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.primary-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:11px 15px;font-weight:800;text-decoration:none;display:inline-block}.archive-unit{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.archive-unit summary{cursor:pointer;font-weight:800;color:var(--navy)}.lesson-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.lesson-links a{color:var(--blue);text-decoration:none;background:#f4faff;border:1px solid var(--line);padding:9px 10px;border-radius:11px;font-size:12px}
.progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.progress-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.progress-card-head{display:flex;align-items:center;gap:10px}.progress-card-head .subject-icon svg{width:44px;height:44px}.progress-card-head div{flex:1}.progress-card-head strong{display:block;color:var(--navy)}.progress-card-head span{font-size:11px;color:var(--muted)}.progress-number{font-size:18px;font-weight:900;color:var(--blue)}.progress-track{height:10px;background:#e7f1f6;border-radius:99px;overflow:hidden;margin-top:12px}.progress-track span{display:block;height:100%;background:linear-gradient(90deg,#0e5c99,#5bc3ee);border-radius:99px}.progress-foot{margin-top:7px;font-size:10px;color:var(--muted)}
.term-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.term-btn{background:#fff;border:1px solid var(--line);padding:9px 12px;color:var(--blue);font-weight:800}.term-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grade-summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:linear-gradient(135deg,#e8f7ff,#fff);border:1px solid #cfe8f5;border-radius:20px;padding:16px 18px;margin-bottom:14px}.grade-summary strong{font-size:22px;color:var(--navy)}.grade-summary span{color:var(--muted);font-size:12px}.grade-list{display:grid;gap:9px}.grade-row{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(180px,1.6fr) 145px 100px;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px}.grade-subject{display:flex;align-items:center;gap:9px}.grade-subject .subject-icon svg{width:36px;height:36px}.grade-subject strong{font-size:13px;color:var(--navy)}.grade-chips{display:flex;gap:5px;flex-wrap:wrap}.grade-chip{display:inline-flex;align-items:center;gap:4px;background:#edf7fc;border:1px solid #d5ebf6;border-radius:99px;padding:4px 7px;color:var(--blue);font-size:11px;font-weight:800}.grade-chip button{border:0;background:transparent;color:#7f8e99;cursor:pointer;padding:0}.grade-add{display:flex;gap:5px}.grade-add input{width:84px;border:1px solid var(--line);border-radius:9px;padding:7px 8px}.tiny-btn{background:var(--blue);color:#fff;padding:7px 9px;font-weight:900}.grade-average{text-align:right;font-weight:900;color:var(--navy)}.annual-table{width:100%;border-collapse:separate;border-spacing:0 8px}.annual-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:0 10px}.annual-table td{background:#fff;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.annual-table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.annual-table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0;font-weight:900;color:var(--navy)}
.archive-plans{margin-top:18px}.archive-plans details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}.archive-plans summary{cursor:pointer;font-weight:800;color:var(--navy)}.archive-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.archive-day{background:#f7fbfd;border-radius:10px;padding:9px}.archive-day strong{display:block;font-size:11px}.archive-day span{display:block;font-size:10px;color:var(--muted);margin:3px 0}.toast{position:fixed;right:24px;bottom:24px;background:#073763;color:#fff;padding:12px 15px;border-radius:14px;box-shadow:var(--shadow);z-index:20;font-weight:800;font-size:12px;animation:toast 3s forwards}@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
@media(max-width:1100px){.days{grid-template-columns:repeat(2,1fr)}.subject-grid{grid-template-columns:repeat(3,1fr)}.grade-row{grid-template-columns:1fr 1.4fr 130px 80px}.archive-days{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app-shell{display:block}.sidebar{position:fixed;left:-285px;width:270px;transition:.2s;box-shadow:12px 0 30px rgba(7,55,99,.15)}.sidebar.open{left:0}.main-content{padding:0 15px 25px}.topbar{min-height:76px}.mobile-menu{display:block;border:0;background:#fff;border-radius:10px;padding:9px}.backup-btn{display:none}.days,.subject-grid,.progress-grid{grid-template-columns:1fr}.hero-week{grid-template-columns:1fr}.grade-row{grid-template-columns:1fr}.grade-average{text-align:left}.archive-days{grid-template-columns:1fr}.lesson-links{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.planning-tools,.backup-btn,footer{display:none!important}.app-shell{display:block}.main-content{padding:0}.days{grid-template-columns:repeat(5,1fr);gap:6px}.day,.progress-card,.course-panel{box-shadow:none}.content{max-width:none}}

.lesson-links{display:grid;gap:10px;margin-top:18px}
.lesson-links .lesson-open{text-align:left;width:100%;border:0;cursor:pointer}
</style>
</head>

  const embeddedCourses = {"anglais": [{"title": "Anglais 5e - Unité 3 - Séance 1 - A book for Emma’s birthday", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 1 - A book for Emma’s birthday</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:18px}\n.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:28px 24px;margin:12px 0 20px;box-shadow:0 10px 26px rgba(49,46,129,.16)}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:8px 0 0}.eyebrow{font-size:13px;color:#e9d5ff;font-weight:800;letter-spacing:.03em}.pill{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12)}\n.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:16px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#5b21b6}.ghost{background:white;color:#333;border:1px solid var(--line)}\nsection{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 16px rgba(0,0,0,.025)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.muted{color:var(--muted);font-size:14px}\n.objectives label{display:block;margin:7px 0}.routine{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.routine er\"], [\"to create\", \"créer\"], [\"a story\", \"une histoire\"], [\"literature\", \"la littérature\"], [\"literary\", \"littéraire\"], [\"literary genres\", \"les genres littéraires\"], [\"poetry\", \"la poésie\"], [\"mystery\", \"le roman / récit à énigme\"], [\"myths and legends\", \"les mythes et légendes\"], [\"science fiction\", \"la science-fiction\"], [\"biography\", \"la biographie\"], [\"autobiography\", \"l’autobiographie\"], [\"historical fiction\", \"le roman / récit historique\"], [\"a title\", \"un titre\"], [\"a summary / blurb\", \"un résumé / texte de quatrième de couverture\"]], \"rules\": [[\"Comprendre sans traduire chaque mot\", \"Commence par les mots transparents : literature, biography, historical, science fiction. Ajoute ensuite les mots que tu connais et le contexte.\"], [\"Repérer la catégorie littéraire\", \"Observe les personnages, le lieu, l’époque et les mots-clés. Space, planet, robot → science fiction. King, legend, ancient hero → myths and legends.\"], [\"Repérer le passé\", \"Dans un récit, certains verbes changent au prétérit : be → was/were, have → had, go → went, find → found, see → saw.\"], [\"Repérer un adverbe\", \"Un adverbe précise souvent comment une action se déroule. Beaucoup d’adverbes se terminent en -ly. Pour l’instant, apprends surtout à les repérer.\"]], \"oral\": [[\"a book\", \"un livre\"], [\"read a story\", \"lire une histoire\"], [\"write a story\", \"écrire une histoire\"], [\"literature\", \"littérature\"], [\"literary genres\", \"genres littéraires\"], [\"science fiction\", \"science-fiction\"], [\"biography\", \"biographie\"], [\"historical fiction\", \"roman historique\"], [\"This book is about a little mouse who is looking for a friend.\", \"Ce livre parle d’une petite souris qui cherche un ami.\"], [\"The story takes place in Africa.\", \"L’histoire se déroule en Afrique.\"]], \"reading\": {\"title\": \"Atelier lecture : deviner un livre grâce à son résumé\", \"text\": \"Book A: A little mouse is very sad because she has no friends. She leaves home to look for a friend. Book B: A big teddy bear waits in a shop for someone to give him a home. Book C: In the Kalahari, a hunter and his wife discover a magnificent beast, while an enemy follows strange footprints.\", \"questions\": [[\"Quel résumé parle d’une souris ?\", [\"A\"]], [\"Quel résumé parle d’un ours ?\", [\"B\"]], [\"Quel résumé se déroule en Afrique ?\", [\"C\"]], [\"Trouve un mot transparent.\", [\"magnificent\", \"enemy\"]], [\"Quel verbe signifie « découvrir » ?\", [\"discover\"]]]}, \"written\": [[\"Traduis : un livre\", [\"a book\"]], [\"Traduis : lire une histoire\", [\"read a story\", \"to read a story\"]], [\"Traduis : écrire une histoire\", [\"write a story\", \"to write a story\"]], [\"Traduis : la littérature\", [\"literature\"]], [\"Traduis : la science-fiction\", [\"science fiction\"]], [\"Traduis : une biographie\", [\"a biography\", \"biography\"]], [\"Complète : be → ____ / were\", [\"was\"]], [\"Complète : go → ____\", [\"went\"]], [\"Complète : find → ____\", [\"found\"]], [\"Traduis : Cette histoire parle d’une petite souris.\", [\"this story is about a little mouse\"]]], \"quiz\": [[\"Quel mot signifie « une histoire » ?\", [\"a title\", \"a story\", \"a bookshop\", \"a poem\"], 1, \"a story = une histoire.\"], [\"Quel genre parle souvent du futur, de l’espace ou de robots ?\", [\"poetry\", \"biography\", \"science fiction\", \"historical fiction\"], 2, \"Science fiction.\"], [\"Une biography raconte…\", [\"la vie de quelqu’un\", \"une énigme\", \"un poème\", \"une légende\"], 0, \"Biography = biographie.\"], [\"Quel est un mot transparent ?\", [\"story\", \"historical\", \"read\", \"book\"], 1, \"historical ressemble à « historique ».\"], [\"Pour comprendre un texte, faut-il traduire chaque mot ?\", [\"oui, toujours\", \"non\", \"seulement les verbes\", \"seulement les noms\"], 1, \"On utilise les indices et le contexte.\"], [\"Le prétérit de go est…\", [\"goed\", \"went\", \"gone\", \"goes\"], 1, \"go → went.\"], [\"Le prétérit de find est…\", [\"finded\", \"found\", \"fond\", \"finding\"], 1, \"find → found.\"], [\"Dans un résumé, « takes place » indique…\", [\"le lieu / cadre\", \"le titre\", \"l’auteur\", \"le prix\"], 0, \"takes place = se déroule.\"], [\"Mystery correspond le mieux à…\", [\"un récit à énigme\", \"une biographie\", \"un poème\", \"un manuel\"], 0, \"Mystery = récit à énigme.\"], [\"Le mot autobiography désigne…\", [\"un récit historique\", \"la vie racontée par la personne elle-même\", \"un conte\", \"une légende\"], 1, \"Autobiography = autobiographie.\"]], \"oral_missions\": [[\"Présente un livre en 2 phrases.\", \"This book is about… / The story takes place in…\"], [\"Dis trois catégories littéraires.\", \"Science fiction, biography, mystery.\"], [\"Explique à voix haute comment tu repères un mot transparent.\", \"Je cherche un mot proche du français et je vérifie avec le contexte.\"], [\"Lis lentement puis normalement : literature – literary – literary genres.\", \"literature – literary – literary genres\"]], \"final\": [[\"Quel mot signifie « genre littéraire » ?\", [\"literary genre\", \"story genre\", \"book genre\", \"literature sort\"], 0, \"literary genre.\"], [\"Le passé de see est…\", [\"saw\", \"seen\", \"seed\", \"seeed\"], 0, \"see → saw.\"], [\"Quel indice est prioritaire dans un texte ?\", [\"les mots transparents\", \"la couleur de la page\", \"la longueur\", \"le numéro de page\"], 0, \"Les mots transparents aident à entrer dans le sens.\"], [\"Historical fiction signifie…\", [\"roman historique\", \"science-fiction\", \"biographie\", \"poésie\"], 0, \"historical fiction.\"], [\"Dans « A little mouse was sad », was est…\", [\"présent\", \"prétérit de be\", \"infinitif\", \"adverbe\"], 1, \"was = passé de be.\"], [\"Un texte court derrière un livre est souvent…\", [\"a blurb / summary\", \"a castle\", \"a wand\", \"a slipper\"], 0, \"C’est un résumé / blurb.\"]], \"recall\": [[\"Cite 4 catégories littéraires.\", \"poetry, mystery, science fiction, biography…\"], [\"Que fais-tu d’abord face à un texte difficile ?\", \"Je cherche les mots transparents et les mots connus.\"], [\"go au passé ?\", \"went\"], [\"find au passé ?\", \"found\"], [\"Comment dire « une histoire » ?\", \"a story\"], [\"Comment dire « genres littéraires » ?\", \"literary genres\"]]};\nconst session=1;\nconst esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');\nconst strict=(v)=>String(v||'').toLowerCase().replace(/[?!.,;:’']/g,'').replace(/\\s+/g,' ').trim();\nconst loose=(v)=>strict(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst root=document.getElementById('root');\n\nfunction readingHTML(){\n const r=S.reading;\n return `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 2 - Once upon a time…", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 2 - Once upon a time…</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvet arfs\", \"Blanche-Neige et les Sept Nains\"], [\"The Princess and the Pea\", \"La Princesse au petit pois\"]], \"rules\": [[\"Méthode 1 : mots transparents\", \"Cherche d’abord les mots proches du français : princess, dragon, poison…\"], [\"Méthode 2 : mots connus\", \"Utilise ce que tu as déjà mémorisé. Le vocabulaire est un outil de compréhension.\"], [\"Méthode 3 : mot racine\", \"Dans duckling, repère duck. Dans sleeping, repère sleep.\"], [\"Méthode 4 : contexte\", \"Dans un conte, castle + princess + witch + magic wand donnent un contexte très clair.\"], [\"Formules du conte\", \"Beaucoup de contes commencent par Once upon a time… et se terminent par …lived happily ever after.\"]], \"oral\": [[\"a castle\", \"un château\"], [\"a princess\", \"une princesse\"], [\"a magic wand\", \"une baguette magique\"], [\"a witch\", \"une sorcière\"], [\"a dragon\", \"un dragon\"], [\"a carriage and horses\", \"un carrosse et des chevaux\"], [\"Once upon a time…\", \"Il était une fois…\"], [\"Little Red Riding Hood\", \"Le Petit Chaperon rouge\"], [\"Snow White and the Seven Dwarfs\", \"Blanche-Neige et les Sept Nains\"], [\"They lived happily ever after.\", \"Ils vécurent heureux pour toujours.\"]], \"reading\": {\"title\": \"Atelier indices : quel conte ?\", \"text\": \"1. A girl wears red and takes a basket of cakes to her grandmother. 2. A princess sleeps for a very long time. 3. Three brothers build three different houses. 4. A girl lives with seven small miners. 5. A girl loses a special shoe after a ball.\", \"questions\": [[\"Conte 1 ?\", [\"little red riding hood\"]], [\"Conte 2 ?\", [\"sleeping beauty\"]], [\"Conte 3 ?\", [\"the three little pigs\"]], [\"Conte 4 ?\", [\"snow white and the seven dwarfs\"]], [\"Conte 5 ?\", [\"cinderella\"]]]}, \"written\": [[\"Traduis : un château\", [\"a castle\"]], [\"Traduis : une princesse\", [\"a princess\"]], [\"Traduis : une baguette magique\", [\"a magic wand\"]], [\"Traduis : une sorcière\", [\"a witch\"]], [\"Traduis : un dragon\", [\"a dragon\"]], [\"Traduis : Il était une fois…\", [\"once upon a time\"]], [\"Traduis : Le Petit Chaperon rouge\", [\"little red riding hood\"]], [\"Traduis : Blanche-Neige et les Sept Nains\", [\"snow white and the seven dwarfs\"]], [\"Trouve la racine de duckling.\", [\"duck\"]], [\"Trouve la racine de sleeping.\", [\"sleep\"]]], \"quiz\": [[\"Une magic wand est…\", [\"un carrosse\", \"une baguette magique\", \"un château\", \"une chaussure\"], 1, \"magic wand = baguette magique.\"], [\"A witch signifie…\", [\"une fée\", \"une sorcière\", \"une princesse\", \"une reine\"], 1, \"witch = sorcière.\"], [\"Quel titre contient un nombre ?\", [\"Cinderella\", \"Puss in Boots\", \"Snow White and the Seven Dwarfs\", \"Sleeping Beauty\"], 2, \"Seven = sept.\"], [\"duckling contient la racine…\", [\"duck\", \"ling\", \"king\", \"luck\"], 0, \"duck = canard.\"], [\"Quelle formule ouvre souvent un conte ?\", [\"At the end\", \"Once upon a time\", \"Yesterday morning\", \"In my opinion\"], 1, \"Once upon a time…\"], [\"Quel indice aide à comprendre « princess » ?\", [\"le mot ressemble au français\", \"sa longueur\", \"le pluriel\", \"la ponctuation\"], 0, \"C’est un mot transparent.\"], [\"Puss in Boots est…\", [\"Le Chat botté\", \"Le Petit Poucet\", \"Cendrillon\", \"La Belle et la Bête\"], 0, \"Puss in Boots = Le Chat botté.\"], [\"The Ugly Duckling est…\", [\"Le Vilain Petit Canard\", \"Le Petit Chaperon rouge\", \"La Belle au bois dormant\", \"La Princesse au petit pois\"], 0, \"Ugly Duckling = Vilain Petit Canard.\"], [\"Goldilocks and the Three Bears contient…\", [\"1 ours\", \"2 ours\", \"3 ours\", \"7 ours\"], 2, \"Three = trois.\"], [\"Pour comprendre, le contexte…\", [\"ne sert jamais\", \"peut confirmer une hypothèse\", \"remplace tout le vocabulaire\", \"donne la traduction exacte\"], 1, \"Le contexte aide à déduire.\"]], \"oral_missions\": [[\"Choisis un conte connu et donne 3 mots-clés en anglais.\", \"Ex. Cinderella: prince, ball, glass slipper.\" urn `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 3 - Some famous characters!", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 3 - Some famous characters!</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1040px;margin:auto;padding:18px}\n.hero{background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;border-radius:22px;padding:28px 24px;margin:12px 0 20px;box-shadow:0 10px 26px rgba(49,46,129,.16)}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}.hero p{margin:8px 0 0}.eyebrow{font-size:13px;color:#e9d5ff;font-weight:800;letter-spacing:.03em}.pill{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12)}\n.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:16px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#5b21b6}.ghost{background:white;color:#333;border:1px solid var(--line)}\nsection{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 16px rgba(0,0,0,.025)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.muted{color:var(--muted);font-size:14px}\n.objectives label{display:block;margin:7px 0}.routine{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.routine div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fafafa}.routine b{display:block;font-size:18px}\n.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.rule{background:var(--warnbg);border-left:5px solid #f59e0b}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:13px;border-radius:10px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{background:#f3f4f6}\n.flash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flash-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;text-align:left;min-height:88px}.flash-card .en{font-weight:800;font-size:18px}.flash-card .fr{display:none;color:#5b21b6;margin-top:7px;font-weight:700}.flash-card.open .fr{display:block}\n.oral-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.oral-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.repeat{font-size:13px}.audio{background:#eef2ff;color:#3730a3;padding:7px 10px;border-radius:9px}\n.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:17px;background:#fdfcff}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}.choice:hover{border-color:#a78bfa}.feedback{display:none;margin-top:9px;padding:10px;border-radius:9px;font-weight:700}.feedback.good{display:block;background:var(--okbg);color:var(--ok)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}.feedback.almost{display:block;background:var(--warnbg);color:var(--warn)}\n.progress{height:11px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 15px}.progress div{height:100%;background:var(--accent);width:0;transition:.2s}.hidden{display:none}.score{font-size:29px;font-weight:900;color:#5b21b6}\n.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.inputrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:16px}\n.reading{background:#fbfaff;border:1px solid #ddd6fe;border-radius:14px;padding:15px;margin:12px 0}.reading-text{background:#fff;border-left:4px solid var(--accent);padding:12px;border-radius:9px}\n.model{display:none;background:#faf5ff;border-left:4px solid var(--accent);padding:10px;margin-top:8px;border-radius:8px}.oral-mission.open .model{display:block}.review{background:#eff6ff;border-left:5px solid #2563eb;padding:12px;border-radius:10px;margin:9px 0}\n@media(max-width:760px){.routine{grid-template-columns:1fr 1fr}.g2,.g3,.flash-grid{grid-template-columns:1fr}.oral-row{align-items:flex-start;flex-direction:column}}\n@media print{body{background:white}.toolbar,.screen-only,.audio,.quiz-next{display:none!important}section{box-shadow:none;break-inside:auto}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.flash-card .fr,.model{display:block!important}}\n</style></head>\n<body><main id=\"root\"></main>\n<script>\nconst S={\"title\": \"Some famous characters!\", \"subtitle\": \"Décrire les personnages et déduire le sens des adjectifs grâce au contexte.\", \"objectives\": [\"Je sais décrire les cheveux et les yeux avec be et have got.\", \"Je connais des adjectifs positifs et négatifs pour décrire un personnage.\", \"Je sais utiliser le contraste et les mots racines pour deviner un mot.\", \"Je peux identifier un personnage de conte à partir de sa description.\"], \"vocab\": [[\"beautiful\", \"beau / belle\"], [\"ugly\", \"laid / laide\"], [\"blond-haired\", \"aux cheveux blonds\"], [\"brown-haired\", \"aux cheveux bruns\"], [\"black-haired\", \"aux cheveux noirs\"], [\"red-haired\", \"roux / rousse\"], [\"brown-eyed\", \"aux yeux marron\"], [\"green-eyed\", \"aux yeux verts\"], [\"blue-eyed\", \"aux yeux bleus\"], [\"lovely\", \"adorable / charmant\"], [\"kind\", \"gentil / gentille\"], [\"nasty\", \"méchant / désagréable\"], [\"dirty\", \"sale\"], [\"old\", \"vieux / vieille\"], [\"fantastic\", \"fantastique\"], [\"handsome\", \"beau (homme)\"], [\"good-looking\", \"beau / séduisant\"], [\"mean\", \"méchant\"], [\"nice\", \"gentil / agréable\"], [\"wicked\", \"méchant / mauvais\"], [\"messy\", \"en désordre\"], [\"brave\", \"courageux\"], [\"gentle\", \"doux / gentil\"], [\"friendly\", \"amical\"]], \"rules\": [[\"Décrire avec HAVE GOT\", \"She has got black hair. She has got brown eyes.\"], [\"Décrire avec BE + adjectif composé\", \"She is black-haired. She is brown-eyed.\"], [\"Les adjectifs ne s’accordent pas\", \"two ugly sisters, three brave knights : pas de -s à l’adjectif.\"], [\"Déduire grâce au contraste\", \"Dans lovely and kind BUT nasty sisters, but signale une opposition : nasty est négatif.\"], [\"Mots racines\", \"stepdaughter contient daughter. Cela aide à comprendre « belle-fille ».\"]], \"oral\": [[\"She has got black hair.\", \"Elle a les cheveux noirs.\"], [\"She is black-haired.\", \"Elle est brune / aux cheveux noirs.\"], [\"She has got blue eyes.\", \"Elle a les yeux bleus.\"], [\"She is blue-eyed.\", \"Elle a les yeux bleus.\"], [\"She is lovely and kind.\", \"Elle est adorable et gentille.\"], [\"Her sisters are nasty.\", \"Ses sœurs sont méchantes.\"], [\"The knight is brave.\", \"Le chevalier est courageux.\"], [\"The dragon is friendly.\", \"Le dragon est amical.\"], [\"The monster is ugly and nasty.\", \"Le monstre est laid et méchant.\"], [\"The prince is handsome.\", \"Le prince est beau.\"]], \"reading\": {\"title\": \"Atelier personnages : repérer les adjectifs\", \"text\": \"A kind and beautiful princess lived in a castle. An ugly, nasty monster locked her in a dark tower. Many brave knights tried to help her. A friendly dragon finally rescued her. Later, the dragon became a handsome prince.\", \"questions\": [[\"Deux adjectifs pour la princesse ?\", [\"kind beautiful\", \"beautiful kind\"]], [\"Deux adjectifs pour le monstre ?\", [\"ugly nasty\", \"nasty ugly\"]], [\"Un adjectif pour les chevaliers ?\", [\"brave\"]], [\"Un adjectif pour le dragon ?\", [\"friendly\"]], [\"Un adjectif pour le prince ?\", [\"handsome\"]]]}, \"written\": [[\"Traduis : Elle a les cheveux noirs.\", [\"she has got black hair\"]], [\"Traduis : Elle est aux cheveux noirs.\", [\"she is black-haired\", \"she is black haired\"]], [\"Traduis : Elle a les yeux verts.\", [\"she has got green eyes\"]], [\"Traduis : Elle est aux yeux bleus.\", [\"she is blue-eyed\", \"she is blue eyed\"]], [\"Traduis : gentil / gentille\", [\"kind\"]], [\"Traduis : méchant / mauvais\", [\"wicked\", \"mean\", \"nasty\"]], [\"Traduis : courageux\", [\"brave\"]], [\"Traduis : amical\", [\"friendly\"]], [\"Complète : two ____ sisters (laides)\", [\"ugly\"]], [\"Complète : a ____ prince (beau)\", [\"handsome\"]]], \"quiz\": [[\"black-haired signifie…\", [\"aux yeux noirs\", \"aux cheveux noirs\", \"aux cheveux blonds\", \"sale\"], 1, \"black-haired = cheveux noirs.\"], [\"blue-eyed signifie…\", [\"yeux bleus\", \"cheveux bleus\", \"triste\", \"gentil\"], 0, \"blue-eyed = yeux bleus.\"], [\"Quel adjectif est positif ?\", [\"nasty\", \"wicked\", \"kind\", \"ugly\"], 2, \"kind = gentil.\"], [\"Quel adjectif est négatif ?\", [\"lovely\", \"beautiful\", \"mean\", \"nice\"], 2, \"mean = méchant.\"], [\"handsome décrit surtout…\", [\"un beau garçon / homme\", \"une maison\", \"un monstre\", \"un objet\"], 0, \"handsome = beau, pour un homme.\"], [\"Dans « kind but nasty », but indique…\", [\"une addition\", \"une opposition\", \"un lieu\", \"une date\"], 1, \"but = mais.\"], [\"Phrase correcte :\", [\"two uglies sisters\", \"two ugly sisters\", \"two uglys sisters\", \"two sisters uglies\"], 1, \"L’adjectif est invariable et placé avant le nom.\"], [\"She has got brown eyes = …\", [\"She is brown-eyed.\", \"She is brown-haired.\", \"She has brown hair.\", \"She is brown.\"], 0, \"brown-eyed.\"], [\"friendly signifie…\", [\"agressif\", \"amical\", \"sale\", \"vieux\"], 1, \"friendly = amical.\"], [\"brave signifie…\", [\"courageux\", \"gentil\", \"beau\", \"effrayant\"], 0, \"brave = courageux.\"]], \"oral_missions\": [[\"Décris une princesse en 3 adjectifs.\", \"She is beautiful, kind and gentle.\"], [\"Décris un monstre en 3 adjectifs.\", \"It is ugly, nasty and scary.\"], [\"Décris une personne avec have got puis avec be.\", \"She has got blue eyes. She is blue-eyed.\"], [\"Fais deviner Cendrillon en 3 indices.\", \"She is kind. She has got nasty sisters. She wears a fantastic dress.\"]], \"final\": [[\"She has got blond hair = …\", [\"She is blond-haired.\", \"She is blond-eyed.\", \"She is beautiful-haired.\", \"She has blond-eyed.\"], 0, \"blond-haired.\"], [\"Quel mot est le contraire logique de beautiful ?\", [\"lovely\", \"ugly\", \"kind\", \"nice\"], 1, \"ugly.\"], [\"wicked est…\", [\"positif\", \"négatif\", \"un verbe\", \"un adverbe\"], 1, \"wicked est négatif.\"], [\"L’adjectif anglais au pluriel…\", [\"prend -s\", \"ne change pas\", \"prend -es\", \"vient après le nom\"], 1, \"Il est invariable.\"], [\"friendly dragon signifie…\", [\"dragon amical\", \"dragon laid\", \"dragon rouge\", \"dragon vieux\"], 0, \"friendly = amical.\"], [\"good-looking signifie…\", [\"laid\", \"beau / séduisant\", \"méchant\", \"courageux\"], 1, \"good-looking.\"]], \"recall\": [[\"She has got black hair = ?\", \"She is black-haired.\"], [\"blue-eyed ?\", \"aux yeux bleus\"], [\"3 adjectifs positifs ?\", \"beautiful, lovely, kind…\"], [\"3 adjectifs négatifs ?\", \"ugly, nasty, wicked…\"], [\"Rôle de but ?\", \"Il signale souvent une opposition.\"], [\"brave ?\", \"courageux\"]]};\nconst session=3;\nconst esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');\nconst strict=(v)=>String(v||'').toLowerCase().replace(/[?!.,;:’']/g,'').replace(/\\s+/g,' ').trim();\nconst loose=(v)=>strict(v).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\nconst root=document.getElementById('root');\n\nfunction readingHTML(){\n const r=S.reading;\n return `<div class=\"reading\"><h3>${esc(r.title)}</h3><div class=\"reading-text\">${esc(r.text)}</div>\n ${r.questions.map((q,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(q[0])}</b><div class=\"inputrow\"><input id=\"rq${i}\"><button class=\"soft\" onclick=\"checkReading(${i})\">Vérifier</button></div><div id=\"rqf${i}\" class=\"feedback\"></div></div>`).join('')}</div>`;\n}\nroot.innerHTML=`\n<div class=\"wrap\">\n<header class=\"hero\"><div class=\"eyebrow\">ANGLAIS 5e · CNED · UNITÉ 3 — FAIRY TALES</div><h1>Séance ${session} — ${esc(S.title)}</h1><p>${esc(S.subtitle)}</p><span class=\"pill\">Cours guidé · oral · exercices · mini-test · rappel J+1</span></header>\n<div class=\"toolbar screen-only\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"btn soft\" onclick=\"window.print()\">🖨️ Imprimer / PDF</button><button class=\"btn ghost\" onclick=\"location.reload()\">↺ Recommencer</button></div>\n\n<section><h2>🎯 Objectifs</h2><div class=\"objectives\">${S.objectives.map(x=>`<label><input type=\"checkbox\"> ${esc(x)}</label>`).join('')}</div></section>\n\n<section><h2>🧠 Routine d’ancrage</h2><div class=\"routine\"><div><b>1</b>Comprendre</div><div><b>2</b>Écouter ×3</div><div><b>3</b>Répéter ×3</div><div><b>4</b>Répondre sans regarder</div><div><b>5</b>Revoir demain 5 min</div></div><p class=\"muted\">Le but n’est pas de finir vite : chaque information revient plusieurs fois sous une forme différente.</p></section>\n\n<section><h2>📘 Cours pas à pas</h2>\n<h3>Vocabulaire essentiel</h3><table><tr><th>Anglais</th><th>Français</th></tr>${S.vocab.map(v=>`<tr><td><b>${esc(v[0])}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(v[0])},.84)'>🔊</button></td><td>${esc(v[1])}</td></tr>`).join('')}</table>\n<h3>Règles et méthodes</h3><div class=\"grid g2\">${S.rules.map(r=>`<div class=\"card rule\"><b>${esc(r[0])}</b><p>${esc(r[1])}</p></div>`).join('')}</div>\n${readingHTML()}\n</section>\n\n<section><h2>🗣️ Écoute et répétition ×3</h2><p class=\"muted\">Écoute en vitesse normale, puis lente. Répète trois fois à voix haute avant de cocher.</p>\n${S.oral.map((o,i)=>`<div class=\"oral-row\"><div><b>${esc(o[0])}</b><div class=\"muted\">${esc(o[1])}</div></div><div class=\"oral-actions\"><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.84)'>🔊 normal</button><button class=\"audio\" onclick='speak(${JSON.stringify(o[0])},.62)'>🐢 lent</button><label class=\"repeat\"><input type=\"checkbox\"> répété ×3</label></div></div>`).join('')}</section>\n\n<section><h2>🃏 Cartes mémoire</h2><p class=\"muted\">Essaie de traduire avant de cliquer.</p><div class=\"flash-grid\">${S.vocab.map(v=>`<button class=\"flash-card\" onclick=\"this.classList.toggle('open')\"><span class=\"en\">${esc(v[0])}</span><span class=\"fr\">${esc(v[1])}</span></button>`).join('')}</div></section>\n\n<section class=\"screen-only\"><h2>✅ QCM guidé</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><button id=\"next\" class=\"primary quiz-next hidden\" onclick=\"nextQ()\">Question suivante</button></section>\n\n<section><h2>✍️ Écriture sans regarder</h2>${S.written.map((w,i)=>`<div class=\"exercise\"><b>${i+1}. ${esc(w[0])}</b><div class=\"inputrow\"><input id=\"w${i}\"><button class=\"soft screen-only\" onclick=\"checkWritten(${i})\">Vérifier</button></div><div id=\"wf${i}\" class=\"feedback\"></div></div>`).join('')}\n${S.listen?`<h3>🎧 Écoute : retrouve le verbe au passé</h3>${S.listen.map((x,i)=>`<div class=\"exercise\"><b>Phrase ${i+1}</b> <button class=\"audio screen-only\" onclick='speak(${JSON.stringify(x[0])},.76)'>🔊 écouter</button><div class=\"inputrow\"><input id=\"l${i}\" placeholder=\"Écris seulement le ou les verbes au passé\"><button class=\"soft screen-only\" onclick=\"checkListen(${i})\">Vérifier</button></div><div id=\"lf${i}\" class=\"feedback\"></div></div>`).join('')}`:''}\n</section>\n\n<section><h2>🎤 Missions orales</h2><p class=\"muted\">Réponds d’abord sans lire le modèle.</p>${S.oral_missions.map((m,i)=>`<div class=\"exercise oral-mission\" id=\"om${i}\"><b>${i+1}. ${esc(m[0])}</b><div class=\"actions screen-only\"><button class=\"soft\" onclick=\"document.getElementById('om${i}').classList.toggle('open')\">Voir / cacher un modèle</button><button class=\"audio\" onclick='speak(${JSON.stringify(m[1])},.74)'>🔊 écouter</button></div><div class=\"model\">${esc(m[1])}</div></div>`).join('')}</section>\n\n<section class=\"screen-only\"><h2>🏁 Mini-test final</h2><div class=\"progress\"><div id=\"fbar\"></div></div><div id=\"finalq\" class=\"qbox\"></div><button id=\"fnext\" class=\"primary quiz-next hidden\" onclick=\"nextF()\">Question suivante</button></section>\n\n<section><h2>🔁 Révision du lendemain</h2><p>Demain, réponds à voix haute avant de rouvrir le cours.</p>${S.recall.map((r,i)=>`<div class=\"review\"><b>${esc(r[0])}</b><div><button class=\"soft screen-only\" onclick=\"this.nextElementSibling.classList.toggle('hidden')\">Voir la réponse</button><span class=\"hidden\"> — ${esc(r[1])}</span></div></div>`).join('')}</section>\n</div>`;\n\nfunction speak(t,r){if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=r||.84;speechSynthesis.speak(u);}\nfunction showFeedback(id,ok,near,answer){const f=document.getElementById(id);f.className='feedback '+(ok?'good':near?'almost':'bad');f.textContent=ok?'✅ Correct.':near?'🟡 Presque : vérifie l’orthographe.':'❌ À revoir. Réponse possible : '+answer;}\nfunction checkWritten(i){const v=document.getElementById('w'+i).value,a=S.written[i][1];const ok=a.some(x=>strict(x)===strict(v)),near=a.some(x=>loose(x)===loose(v));showFeedback('wf'+i,ok,near,a[0]);}\nfunction checkReading(i){const v=document.getElementById('rq'+i).value,a=S.reading.questions[i][1];const sv=strict(v),lv=loose(v);const ok=a.some(x=>sv.includes(strict(x))||strict(x).includes(sv)&&sv.length>2),near=a.some(x=>lv.includes(loose(x)));showFeedback('rqf'+i,ok,near,a[0]);}\nfunction checkListen(i){const v=document.getElementById('l'+i).value,a=S.listen[i][1];const ok=a.some(x=>strict(x)===strict(v));showFeedback('lf'+i,ok,false,a[0]);}\n\nlet qi=0,qs=0,ql=false;function renderQ(){const q=S.quiz[qi];document.getElementById('bar').style.width=(qi/S.quiz.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class=\"muted\">Question ${qi+1} / ${S.quiz.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerQ(${i})\">${esc(o)}</button>`).join('')}<div id=\"qfb\" class=\"feedback\"></div>`;document.getElementById('next').classList.add('hidden');ql=false;}\nfunction answerQ(i){if(ql)return;ql=true;const q=S.quiz[qi],ok=i===q[2],f=document.getElementById('qfb');if(ok)qs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('next').classList.remove('hidden');}\nfunction nextQ(){qi++;if(qi>=S.quiz.length){document.getElementById('bar').style.width='100%';const p=Math.round(qs/S.quiz.length*100);document.getElementById('quiz').innerHTML=`<div class=\"score\">${qs} / ${S.quiz.length} — ${p}%</div><p>${p>=80?'Très bien : la séance est solide.':p>=60?'Revois seulement les erreurs.':'Reprends les règles et refais le QCM demain.'}</p>`;document.getElementById('next').classList.add('hidden');}else renderQ();}\n\nlet fi=0,fs=0,fl=false;function renderF(){const q=S.final[fi];document.getElementById('fbar').style.width=(fi/S.final.length*100)+'%';document.getElementById('finalq').innerHTML=`<div class=\"muted\">Question ${fi+1} / ${S.final.length}</div><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class=\"choice\" onclick=\"answerF(${i})\">${esc(o)}</button>`).join('')}<div id=\"ffb\" class=\"feedback\"></div>`;document.getElementById('fnext').classList.add('hidden');fl=false;}\nfunction answerF(i){if(fl)return;fl=true;const q=S.final[fi],ok=i===q[2],f=document.getElementById('ffb');if(ok)fs++;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✅ ':'❌ ')+q[3];document.getElementById('fnext').classList.remove('hidden');}\nfunction nextF(){fi++;if(fi>=S.final.length){document.getElementById('fbar').style.width='100%';const p=Math.round(fs/S.final.length*100);document.getElementById('finalq').innerHTML=`<div class=\"score\">${fs} / ${S.final.length} — ${p}%</div><p>${p>=80?'Notion bien ancrée.':p>=60?'Encore quelques points à sécuriser.':'Refais les rappels demain avant de poursuivre.'}</p>`;document.getElementById('fnext').classList.add('hidden');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}, {"title": "Anglais 5e - Unité 3 - Séance 4 - Poor Cinderella!", "html": "<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Anglais 5e - Unité 3 - Séance 4 - Poor Cinderella!</title>\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#7c3aed;--accent2:#f3e8ff;--deep:#312e81;--ok:#166534;--ok

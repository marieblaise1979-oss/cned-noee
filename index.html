n');}else renderF();}\nrenderQ();renderF();\n<\/script></body></html>"}], "espagnol": [{"title": "Espagnol 5e - Unité 2 - Séance 1", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 1</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 1 - ¿Cómo te llamas?</h1><p>Dire son prénom, demander le prénom et présenter un ami</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Conjuguer LLAMARSE au présent</label><br><label><input type=\"checkbox\"> Utiliser mi/mis, tu/tus, su/sus</label><br><label><input type=\"checkbox\"> Demander et donner un prénom</label><br><label><input type=\"checkbox\"> Répéter les sons [au] et [eu] dans les prénoms du cours</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>Poser la question</h3><p>¿Cómo te llamas? = Comment tu t’appelles ?<br>¿Cómo se llama tu amigo? = Comment s’appelle ton ami ?<br>¿Cómo os llamáis? = Comment vous appelez-vous ?</p></div><div class=\"card\"><h3>LLAMARSE - s’appeler</h3><p>me llamo | te llamas | se llama | nos llamamos | os llamáis | se llaman</p></div><div class=\"card\"><h3>Possessifs</h3><p>mi / mis = mon, ma / mes<br>tu / tus = ton, ta / tes<br>su / sus = son, sa / ses</p></div><div class=\"card\"><h3>À retenir</h3><p>Me llamo Pedro.<br>Mi amigo se llama Raúl.<br>Mis amigas se llaman Eulalia y Aurelia.</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>el amigo</b><div class=\"back\">l’ami</div></div><div class=\"card flash\" tabindex=\"0\"><b>la amiga</b><div class=\"back\">l’amie</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Cómo?</b><div class=\"back\">Comment ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>mi / mis</b><div class=\"back\">mon, ma / mes</div></div><div class=\"card flash\" tabindex=\"0\"><b>tu / tus</b><div class=\"back\">ton, ta / tes</div></div><div class=\"card flash\" tabindex=\"0\"><b>su / sus</b><div class=\"back\">son, sa / ses</div></div><div class=\"card flash\" tabindex=\"0\"><b>me llamo</b><div class=\"back\">je m’appelle</div></div><div class=\"card flash\" tabindex=\"0\"><b>te llamas</b><div class=\"back\">tu t’appelles</div></div><div class=\"card flash\" tabindex=\"0\"><b>se llama</b><div class=\"back\">il/elle s’appelle</div></div><div class=\"card flash\" tabindex=\"0\"><b>nos llamamos</b><div class=\"back\">nous nous appelons</div></div><div class=\"card flash\" tabindex=\"0\"><b>os llamáis</b><div class=\"back\">vous vous appelez</div></div><div class=\"card flash\" tabindex=\"0\"><b>se llaman</b><div class=\"back\">ils/elles s’appellent</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Cómo te llamas?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo te llamas?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo te llamas?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Me llamo Noée.</b><div><button class=\"audio\" onclick=\"speak(\\\"Me llamo No\\u00e9e.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Me llamo No\\u00e9e.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cómo se llama tu amigo?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo se llama tu amigo?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo se llama tu amigo?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Mi amigo se llama Raúl.</b><div><button class=\"audio\" onclick=\"speak(\\\"Mi amigo se llama Ra\\u00fal.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Mi amigo se llama Ra\\u00fal.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cómo os llamáis?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo os llam\\u00e1is?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfC\\u00f3mo os llam\\u00e1is?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Nos llamamos Aurelio y Raúl.</b><div><button class=\"audio\" onclick=\"speak(\\\"Nos llamamos Aurelio y Ra\\u00fal.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Nos llamamos Aurelio y Ra\\u00fal.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Laura</b><div><button class=\"audio\" onclick=\"speak(\\\"Laura\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Laura\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Eulalia</b><div><button class=\"audio\" onclick=\"speak(\\\"Eulalia\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Eulalia\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Aurelia</b><div><button class=\"audio\" onclick=\"speak(\\\"Aurelia\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Aurelia\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Eustaquio</b><div><button class=\"audio\" onclick=\"speak(\\\"Eustaquio\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Eustaquio\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Paulina</b><div><button class=\"audio\" onclick=\"speak(\\\"Paulina\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Paulina\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Eugenia</b><div><button class=\"audio\" onclick=\"speak(\\\"Eugenia\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Eugenia\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Mi amiga ___ Laura.</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"se llama\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Y tú, ¿cómo ___?</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"te llamas\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Yo ___ Eulalia.</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"me llamo\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Mis amigos ___ Paulina y Eustaquio.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"se llaman\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Y vosotros, ¿cómo ___?</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"os llamáis\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Nosotros ___ Aurelio y Raúl.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"nos llamamos\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. ___ amigo se llama Raúl. (mon)</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"mi\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. ___ amigas se llaman Eulalia y Aurelia. (mes)</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"mis\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. ¿Cómo se llama ___ amigo? (ton)</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"tu\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. ¿Cómo se llaman ___ amigas? (tes)</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"tus\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. ___ nombre es Lucía. (son/sa)</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"su\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. ___ amigos son alumnos. (ses)</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"sus\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Je m’appelle Noée.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Me llamo Noée.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Mon ami s’appelle Raúl.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Mi amigo se llama Raúl.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Mes amies s’appellent Eulalia et Aurelia.</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"Mis amigas se llaman Eulalia y Aurelia.\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris la question pour demander le prénom d’un ami.</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"¿Cómo se llama tu amigo?\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 1</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Je m’appelle » se dit :\", \"a\": [\"me llamo\", \"te llamas\", \"se llama\", \"nos llamamos\"], \"good\": 0}, {\"q\": \"Pour demander le prénom à une personne que tu tutoies :\", \"a\": [\"¿Quién eres?\", \"¿Cómo te llamas?\", \"¿Dónde vives?\", \"¿Cuántos años tienes?\"], \"good\": 1}, {\"q\": \"Avec « mi amiga », LLAMARSE devient :\", \"a\": [\"me llamo\", \"te llamas\", \"se llama\", \"se llaman\"], \"good\": 2}, {\"q\": \"Avec « mis amigos », LLAMARSE devient :\", \"a\": [\"se llaman\", \"se llama\", \"os llamáis\", \"nos llamamos\"], \"good\": 0}, {\"q\": \"« mes amis » se dit :\", \"a\": [\"mi amigos\", \"mis amigos\", \"tus amigo\", \"sus amiga\"], \"good\": 1}, {\"q\": \"« ton amie » se dit :\", \"a\": [\"tu amiga\", \"tus amiga\", \"mi amiga\", \"su amigas\"], \"good\": 0}, {\"q\": \"Le sujet « nosotros » utilise :\", \"a\": [\"nos llamamos\", \"os llamáis\", \"se llaman\", \"me llamo\"], \"good\": 0}, {\"q\": \"Le sujet « vosotros » utilise :\", \"a\": [\"se llaman\", \"os llamáis\", \"nos llamamos\", \"te llamas\"], \"good\": 1}, {\"q\": \"Quel prénom travaille le son [au] ?\", \"a\": [\"Laura\", \"Eugenia\", \"Lucía\", \"Pilar\"], \"good\": 0}, {\"q\": \"Quel prénom travaille le son [eu] ?\", \"a\": [\"Eulalia\", \"Pedro\", \"Sara\", \"Tomás\"], \"good\": 0}, {\"q\": \"« Comment s’appellent tes amies ? » :\", \"a\": [\"¿Cómo te llamas?\", \"¿Cómo se llaman tus amigas?\", \"¿Quiénes son?\", \"¿Cómo os llamáis?\"], \"good\": 1}, {\"q\": \"En espagnol, les pronoms sujets sont souvent :\", \"a\": [\"obligatoires\", \"omis car la terminaison suffit\", \"toujours après le verbe\", \"interdits\"], \"good\": 1}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 2", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 2</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 2 - ¿Quién eres?</h1><p>Dire qui l’on est et identifier une personne</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Conjuguer SER au présent</label><br><label><input type=\"checkbox\"> Comprendre les pronoms personnels sujets</label><br><label><input type=\"checkbox\"> Utiliser ¿Quién?</label><br><label><input type=\"checkbox\"> Réviser les articles et le lexique de l’école</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>SER - être</h3><p>soy | eres | es | somos | sois | son</p></div><div class=\"card\"><h3>Pronoms personnels</h3><p>yo | tú | él / ella | nosotros / nosotras | vosotros / vosotras | ellos / ellas<br>Ils sont rarement nécessaires sauf pour insister.</p></div><div class=\"card\"><h3>Articles</h3><p>el / la / los / las ; un / una ; pas d’article indéfini pluriel dans les exemples de cette leçon</p></div><div class=\"card\"><h3>À retenir</h3><p>¿Quién eres? = Qui es-tu ?<br>Soy Sara. Soy profesora.<br>Pilar y Esteban son alumnos.<br>Somos amigos.</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>un alumno</b><div class=\"back\">un élève</div></div><div class=\"card flash\" tabindex=\"0\"><b>una alumna</b><div class=\"back\">une élève</div></div><div class=\"card flash\" tabindex=\"0\"><b>el profesor</b><div class=\"back\">le professeur</div></div><div class=\"card flash\" tabindex=\"0\"><b>la profesora</b><div class=\"back\">la professeure</div></div><div class=\"card flash\" tabindex=\"0\"><b>matemáticas</b><div class=\"back\">mathématiques</div></div><div class=\"card flash\" tabindex=\"0\"><b>español</b><div class=\"back\">espagnol</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Quién?</b><div class=\"back\">Qui ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>soy</b><div class=\"back\">je suis</div></div><div class=\"card flash\" tabindex=\"0\"><b>eres</b><div class=\"back\">tu es</div></div><div class=\"card flash\" tabindex=\"0\"><b>es</b><div class=\"back\">il/elle est</div></div><div class=\"card flash\" tabindex=\"0\"><b>somos</b><div class=\"back\">nous sommes</div></div><div class=\"card flash\" tabindex=\"0\"><b>sois</b><div class=\"back\">vous êtes</div></div><div class=\"card flash\" tabindex=\"0\"><b>son</b><div class=\"back\">ils/elles sont</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Quién eres?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n eres?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n eres?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy Noée.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy No\\u00e9e.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy No\\u00e9e.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy una alumna.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy una alumna.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy una alumna.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Él es el profesor de español.</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00c9l es el profesor de espa\\u00f1ol.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00c9l es el profesor de espa\\u00f1ol.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Ella es mi profesora de matemáticas.</b><div><button class=\"audio\" onclick=\"speak(\\\"Ella es mi profesora de matem\\u00e1ticas.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Ella es mi profesora de matem\\u00e1ticas.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Somos amigos.</b><div><button class=\"audio\" onclick=\"speak(\\\"Somos amigos.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Somos amigos.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Pilar y Esteban son alumnos.</b><div><button class=\"audio\" onclick=\"speak(\\\"Pilar y Esteban son alumnos.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Pilar y Esteban son alumnos.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Quién es?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n es?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfQui\\u00e9n es?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Mercedes y Víctor ___ alumnos.</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"son\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Nosotras ___ amigas.</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"somos\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. ¿Quién ___ tú?</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"eres\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. El Señor González ___ el profesor de español.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"es\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Vosotros ___ profesores particulares.</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"sois\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Yo ___ Tomás.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"soy\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. ___ profesor (un/una)</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"un\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. ___ amiga (un/una)</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"una\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. ___ amigos (article défini)</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"los\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. ___ profesoras (article défini)</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"las\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. ___ chica (article défini)</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"la\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. ___ ordenador (article défini)</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"el\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Je suis une élève.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Soy una alumna.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Nous sommes amis.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Somos amigos.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Il est le professeur d’espagnol.</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"Él es el profesor de español.\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Pose la question « Qui est-ce ? »</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"¿Quién es?\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 2</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« Qui es-tu ? » :\", \"a\": [\"¿Cómo te llamas?\", \"¿Quién eres?\", \"¿De dónde eres?\", \"¿Cuál es tu signo?\"], \"good\": 1}, {\"q\": \"« Je suis » :\", \"a\": [\"soy\", \"eres\", \"es\", \"son\"], \"good\": 0}, {\"q\": \"« Nous sommes » :\", \"a\": [\"somos\", \"sois\", \"son\", \"es\"], \"good\": 0}, {\"q\": \"« Vous êtes » :\", \"a\": [\"somos\", \"sois\", \"son\", \"eres\"], \"good\": 1}, {\"q\": \"« Ils sont » :\", \"a\": [\"son\", \"soy\", \"es\", \"somos\"], \"good\": 0}, {\"q\": \"« une élève » :\", \"a\": [\"un alumno\", \"una alumna\", \"la profesor\", \"una profesor\"], \"good\": 1}, {\"q\": \"Article défini pour « profesoras » :\", \"a\": [\"el\", \"la\", \"los\", \"las\"], \"good\": 3}, {\"q\": \"Article indéfini pour « profesor » :\", \"a\": [\"un\", \"una\", \"los\", \"Ø\"], \"good\": 0}, {\"q\": \"« Él » signifie :\", \"a\": [\"elle\", \"lui/il\", \"nous\", \"vous\"], \"good\": 1}, {\"q\": \"« Ella » signifie :\", \"a\": [\"elle\", \"il\", \"ils\", \"je\"], \"good\": 0}, {\"q\": \"Dans « Yo soy el alumno », yo sert surtout à :\", \"a\": [\"faire le pluriel\", \"marquer l’insistance\", \"former une question\", \"indiquer l’âge\"], \"good\": 1}, {\"q\": \"Pour présenter une profession :\", \"a\": [\"Soy profesora.\", \"Tengo profesora.\", \"Me llamo profesora.\", \"Vivo profesora.\"], \"good\": 0}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 3", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 3</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 3 - ¿De dónde son?</h1><p>Dire son origine et sa nationalité</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Utiliser SER DE pour l’origine</label><br><label><input type=\"checkbox\"> Employer ¿De dónde?</label><br><label><input type=\"checkbox\"> Accorder les nationalités en genre et en nombre</label><br><label><input type=\"checkbox\"> Mémoriser plusieurs pays et nationalités hispanophones</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>Origine</h3><p>¿De dónde eres? = D’où es-tu ?<br>Soy de Francia. = Je viens de France.<br>Guillermo es de Chile.</p></div><div class=\"card\"><h3>Nationalité</h3><p>Soy peruana. / Soy peruano.<br>Enrique es colombiano. Estrella es española.</p></div><div class=\"card\"><h3>Genre</h3><p>-o → -a : colombiano / colombiana<br>consonne → +a : español / española<br>-e : ne change pas : nicaragüense</p></div><div class=\"card\"><h3>Nombre</h3><p>voyelle → +s : cubano → cubanos<br>consonne → +es : francés → franceses</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>México</b><div class=\"back\">Mexique</div></div><div class=\"card flash\" tabindex=\"0\"><b>Cuba</b><div class=\"back\">Cuba</div></div><div class=\"card flash\" tabindex=\"0\"><b>Chile</b><div class=\"back\">Chili</div></div><div class=\"card flash\" tabindex=\"0\"><b>Argentina</b><div class=\"back\">Argentine</div></div><div class=\"card flash\" tabindex=\"0\"><b>Colombia</b><div class=\"back\">Colombie</div></div><div class=\"card flash\" tabindex=\"0\"><b>Perú</b><div class=\"back\">Pérou</div></div><div class=\"card flash\" tabindex=\"0\"><b>Venezuela</b><div class=\"back\">Venezuela</div></div><div class=\"card flash\" tabindex=\"0\"><b>mexicano/a</b><div class=\"back\">mexicain/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>cubano/a</b><div class=\"back\">cubain/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>chileno/a</b><div class=\"back\">chilien/ne</div></div><div class=\"card flash\" tabindex=\"0\"><b>argentino/a</b><div class=\"back\">argentin/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>colombiano/a</b><div class=\"back\">colombien/ne</div></div><div class=\"card flash\" tabindex=\"0\"><b>peruano/a</b><div class=\"back\">péruvien/ne</div></div><div class=\"card flash\" tabindex=\"0\"><b>nicaragüense</b><div class=\"back\">nicaraguayen/ne</div></div><div class=\"card flash\" tabindex=\"0\"><b>dominicano/a</b><div class=\"back\">dominicain/e</div></div><div class=\"card flash\" tabindex=\"0\"><b>¿Dónde?</b><div class=\"back\">où ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>ser de</b><div class=\"back\">être de / venir de</div></div><div class=\"card flash\" tabindex=\"0\"><b>el origen</b><div class=\"back\">l’origine</div></div><div class=\"card flash\" tabindex=\"0\"><b>la nacionalidad</b><div class=\"back\">la nationalité</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿De dónde eres?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfDe d\\u00f3nde eres?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfDe d\\u00f3nde eres?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy de Francia.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy de Francia.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy de Francia.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Soy francesa.</b><div><button class=\"audio\" onclick=\"speak(\\\"Soy francesa.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Soy francesa.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Guillermo es de Chile.</b><div><button class=\"audio\" onclick=\"speak(\\\"Guillermo es de Chile.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Guillermo es de Chile.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Enrique es colombiano.</b><div><button class=\"audio\" onclick=\"speak(\\\"Enrique es colombiano.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Enrique es colombiano.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Estrella es española.</b><div><button class=\"audio\" onclick=\"speak(\\\"Estrella es espa\\u00f1ola.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Estrella es espa\\u00f1ola.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Miguel y Sofía son argentinos.</b><div><button class=\"audio\" onclick=\"speak(\\\"Miguel y Sof\\u00eda son argentinos.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Miguel y Sof\\u00eda son argentinos.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Lola e Isabel son ecuatorianas.</b><div><button class=\"audio\" onclick=\"speak(\\\"Lola e Isabel son ecuatorianas.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Lola e Isabel son ecuatorianas.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Somos franceses.</b><div><button class=\"audio\" onclick=\"speak(\\\"Somos franceses.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Somos franceses.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Somos francesas.</b><div><button class=\"audio\" onclick=\"speak(\\\"Somos francesas.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Somos francesas.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Soy ___ Francia.</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"de\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. ¿___ dónde eres?</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"de\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Guillermo ___ de Chile.</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"es\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Miguel y Sofía ___ argentinos.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"son\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Lola e Isabel ___ ecuatorianas.</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"son\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Nosotras ___ francesas.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"somos\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. colombiano → féminin :</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"colombiana\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. español → féminin :</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"española\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. nicaragüense → féminin :</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"nicaragüense\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. cubano → pluriel masc. :</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"cubanos\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. francés → pluriel masc. :</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"franceses\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. ecuatoriana → pluriel fém. :</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"ecuatorianas\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Traduis : Je viens de France.</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"Soy de Francia.\"])'>Vérifier</button></div><div id=\"e1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Je suis française.</b><div class=\"input-row\"><input id=\"e2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e2\",[\"Soy francesa.\"])'>Vérifier</button></div><div id=\"e2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Traduis : Elles sont équatoriennes.</b><div class=\"input-row\"><input id=\"e3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e3\",[\"Son ecuatorianas.\"])'>Vérifier</button></div><div id=\"e3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>Écris la question pour demander l’origine.</b><div class=\"input-row\"><input id=\"e4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e4\",[\"¿De dónde eres?\"])'>Vérifier</button></div><div id=\"e4f\" class=\"feedback\"></div></div></section>\n<section><h2>🧩 QCM de mémorisation</h2><div class=\"progress\"><div id=\"bar\"></div></div><div id=\"quiz\" class=\"qbox\"></div><div class=\"quiz-controls\" style=\"margin-top:12px\"><button id=\"nextBtn\" class=\"primary hidden\" onclick=\"nextQ()\">Question suivante</button></div></section>\n<section><h2>🗣️ Mission orale finale</h2><p>Sans regarder le cours, réponds à voix haute à 4 consignes :</p><ol><li>Dis au moins 2 phrases de la leçon.</li><li>Pose une question de la séance.</li><li>Réponds à cette question avec une phrase complète.</li><li>Répète une dernière fois les mots de prononciation.</li></ol><div class=\"note\">Reviens demain et refais uniquement le QCM + 4 phrases à l’oral. C’est cette récupération sans support qui fixe la leçon.</div></section>\n<footer class=\"mini\">Cours interactif de révision - Espagnol 5e - Unité 2 - Séance 3</footer></div>\n<script>const QUIZDATA=[{\"q\": \"« D’où es-tu ? » :\", \"a\": [\"¿Dónde vives?\", \"¿De dónde eres?\", \"¿Quién eres?\", \"¿Cómo estás?\"], \"good\": 1}, {\"q\": \"Pour dire « Je viens de France » :\", \"a\": [\"Soy Francia.\", \"Soy de Francia.\", \"Tengo Francia.\", \"Vivo de Francia.\"], \"good\": 1}, {\"q\": \"Féminin de colombiano :\", \"a\": [\"colombiano\", \"colombiana\", \"colombianes\", \"colombianas\"], \"good\": 1}, {\"q\": \"Féminin de español :\", \"a\": [\"española\", \"españole\", \"español\", \"españolas\"], \"good\": 0}, {\"q\": \"Féminin de nicaragüense :\", \"a\": [\"nicaragüensa\", \"nicaragüense\", \"nicaragüesa\", \"nicaragüenses\"], \"good\": 1}, {\"q\": \"Pluriel de cubano :\", \"a\": [\"cubanoes\", \"cubanos\", \"cubanes\", \"cubano\"], \"good\": 1}, {\"q\": \"Pluriel de francés :\", \"a\": [\"francéss\", \"franceses\", \"francéses\", \"francés\"], \"good\": 1}, {\"q\": \"Une femme du Pérou est :\", \"a\": [\"peruano\", \"peruana\", \"cubana\", \"mexicana\"], \"good\": 1}, {\"q\": \"Des personnes d’Argentine :\", \"a\": [\"argentinos / argentinas\", \"argentinianos\", \"argentes\", \"argentino\"], \"good\": 0}, {\"q\": \"¿Dónde? signifie :\", \"a\": [\"quand ?\", \"où ?\", \"combien ?\", \"qui ?\"], \"good\": 1}, {\"q\": \"« la nacionalidad » :\", \"a\": [\"l’âge\", \"la langue\", \"la nationalité\", \"l’adresse\"], \"good\": 2}, {\"q\": \"« ser de » sert à exprimer :\", \"a\": [\"l’âge\", \"l’origine\", \"le prénom\", \"l’anniversaire\"], \"good\": 1}];document.querySelectorAll('.flash').forEach(function(c){c.addEventListener('click',function(){c.classList.toggle('open')});c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('open')}})});\nlet activeInput=null;document.querySelectorAll('input[type=text]').forEach(i=>i.addEventListener('focus',()=>activeInput=i));document.querySelectorAll('.charbtn').forEach(b=>b.addEventListener('click',()=>{if(!activeInput)return;const p=activeInput.selectionStart??activeInput.value.length;activeInput.value=activeInput.value.slice(0,p)+b.dataset.c+activeInput.value.slice(p);activeInput.focus();activeInput.setSelectionRange(p+1,p+1)}));\nfunction norm(s){return s.toLowerCase().normalize('NFC').replace(/[’']/g,\"'\").replace(/[?!.,;:¡¿]/g,'').replace(/\\s+/g,' ').trim()}\nfunction checkText(id,answers){const v=norm(document.getElementById(id).value);const ok=answers.map(norm).includes(v);const f=document.getElementById(id+'f');if(ok){f.className='feedback good';f.textContent='✅ Correct.'}else{f.className='feedback bad';f.textContent='❌ À revoir. Relis la règle puis réessaie.'}}\nfunction speak(t,slow=false){if(!('speechSynthesis' in window)){alert(\"La lecture audio n'est pas disponible dans ce navigateur.\");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.65:.88;speechSynthesis.speak(u)}\nconst qs=QUIZDATA;let qi=0,score=0,locked=false;function renderQ(){locked=false;const q=qs[qi];document.getElementById('bar').style.width=(qi/qs.length*100)+'%';let h=`<div class=\"tiny\">Question ${qi+1} / ${qs.length}</div><h3>${q.q}</h3>`;q.a.forEach((c,i)=>h+=`<label class=\"choice\"><input type=\"radio\" name=\"qq\" onclick=\"answerQ(${i})\"> ${c}</label>`);h+='<div id=\"qfb\" class=\"feedback\"></div>';document.getElementById('quiz').innerHTML=h;document.getElementById('nextBtn').classList.add('hidden')}\nfunction answerQ(i){if(locked)return;locked=true;const q=qs[qi],f=document.getElementById('qfb');if(i===q.good){score++;f.className='feedback good';f.textContent='✅ Bonne réponse.'}else{f.className='feedback bad';f.textContent='❌ Réponse attendue : '+q.a[q.good]}document.querySelectorAll('input[name=qq]').forEach(x=>x.disabled=true);document.getElementById('nextBtn').classList.remove('hidden')}\nfunction nextQ(){qi++;if(qi>=qs.length){document.getElementById('bar').style.width='100%';const pct=Math.round(score/qs.length*100);document.getElementById('quiz').innerHTML=`<div class=\"finalscore\">${score}/${qs.length} - ${pct}%</div><p>${pct>=80?'Notions bien installées.':pct>=60?'Revois les erreurs puis recommence.':'Reprends la leçon et les exercices ciblés.'}</p><button class=\"soft\" onclick=\"restartQ()\">Recommencer</button>`;document.getElementById('nextBtn').classList.add('hidden')}else renderQ()}\nfunction restartQ(){qi=0;score=0;renderQ()}\nfunction resetAll(){restartQ();document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('.feedback').forEach(f=>{f.className='feedback';f.textContent=''});document.querySelectorAll('.flash').forEach(c=>c.classList.remove('open'));window.scrollTo({top:0,behavior:'smooth'})}\nrenderQ();\n<\/script></body></html>"}, {"title": "Espagnol 5e - Unité 2 - Séance 4", "html": "<!doctype html><html lang=\"fr\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Espagnol 5e - Unité 2 - Séance 4</title><style>\n:root{--bg:#f7f8fb;--card:#fff;--ink:#20242d;--muted:#667085;--line:#e5e7eb;--accent:#6d28d9;--accent2:#ede9fe;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.55}.wrap{max-width:1050px;margin:auto;padding:18px}header{color:white;border-radius:22px;padding:28px 24px;margin:14px 0 22px;background:linear-gradient(135deg,#4c1d95,#7c3aed);box-shadow:0 12px 28px rgba(76,29,149,.18)}header h1{margin:0;font-size:clamp(28px,4vw,44px)}header p{margin:8px 0 0}.tiny{font-size:13px;color:var(--muted)}header .tiny{color:#ddd6fe}.pill{display:inline-block;margin-top:12px;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer;min-height:42px}.primary{background:var(--accent);color:white}.soft{background:var(--accent2);color:#4c1d95}.ghost{background:white;border:1px solid var(--line);color:#333}section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 18px rgba(0,0,0,.035)}h2{margin-top:0;font-size:25px}h3{margin-bottom:8px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.flash{cursor:pointer}.flash .back{display:none;color:#5b21b6;font-weight:700;margin-top:7px}.flash.open .back{display:block}.note{background:#f5f3ff;border-left:5px solid var(--accent);padding:14px;border-radius:10px;margin:12px 0}.remember{background:var(--warnbg);border-left:5px solid #f59e0b;padding:14px;border-radius:10px;margin:12px 0}.audio{display:inline-flex;background:#eef2ff;color:#3730a3;padding:7px 9px;border-radius:9px;margin:3px}.slow{background:#fef3c7;color:#92400e}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}input[type=text]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px}.feedback{margin-top:9px;padding:10px 12px;border-radius:10px;font-weight:700;display:none}.good{display:block;background:var(--okbg);color:var(--ok)}.bad{display:block;background:var(--badbg);color:var(--bad)}.qbox{border:2px solid #ddd6fe;border-radius:16px;padding:18px;background:#fbfaff}.choice{display:block;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.choice:hover{border-color:#a78bfa}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#7c3aed;width:0;transition:.25s}.hidden{display:none}.finalscore{font-size:30px;font-weight:900;color:#5b21b6}.charbar{display:flex;gap:6px;flex-wrap:wrap}.charbar button{min-width:44px;background:#fff;border:1px solid #cbd5e1;font-size:18px;padding:6px}.oralrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.oralrow b{font-size:18px}.repeatdots{font-size:20px;letter-spacing:4px;color:#6d28d9}.mini{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:9px;text-align:left}th{background:#f3f4f6}@media print{.toolbar,.audio,.charbar,.no-print,.quiz-controls{display:none!important}body{background:white}section{box-shadow:none;break-inside:avoid}header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n</style></head><body><div class=\"wrap\">\n<header><div class=\"tiny\">ESPAGNOL 5e - CNED - UNITÉ 2 ¿Quién eres?</div><h1>Séance 4 - ¿Cuántos años tienes?</h1><p>Dire son âge, réviser les nombres et travailler TENER</p><span class=\"pill\">LV2 débutant - écouter, répéter, rappeler, écrire</span></header>\n<div class=\"toolbar no-print\"><button onclick=\"window.close()\" style=\"margin:8px 0\">← Fermer le cours</button><button class=\"soft\" onclick=\"window.print()\">🖨️ Imprimer</button><button class=\"ghost\" onclick=\"resetAll()\">↺ Recommencer</button></div>\n<section><h2>🎯 Objectifs</h2><label><input type=\"checkbox\"> Conjuguer TENER</label><br><label><input type=\"checkbox\"> Demander et dire l’âge</label><br><label><input type=\"checkbox\"> Réviser les nombres de 0 à 31</label><br><label><input type=\"checkbox\"> Comprendre le diminutif -ito/-ita</label><br><label><input type=\"checkbox\"> Répéter les sons [s] et [θ] travaillés par le CNED</label><br></section>\n<section><h2>⌨️ Caractères espagnols</h2><p class=\"mini\">Clique dans une case de réponse puis sur un caractère.</p><div class=\"charbar\"><button type=\"button\" class=\"charbtn\" data-c=\"ñ\">ñ</button><button type=\"button\" class=\"charbtn\" data-c=\"á\">á</button><button type=\"button\" class=\"charbtn\" data-c=\"é\">é</button><button type=\"button\" class=\"charbtn\" data-c=\"í\">í</button><button type=\"button\" class=\"charbtn\" data-c=\"ó\">ó</button><button type=\"button\" class=\"charbtn\" data-c=\"ú\">ú</button><button type=\"button\" class=\"charbtn\" data-c=\"ü\">ü</button><button type=\"button\" class=\"charbtn\" data-c=\"¿\">¿</button><button type=\"button\" class=\"charbtn\" data-c=\"¡\">¡</button></div></section>\n<section><h2>📘 Le cours expliqué simplement</h2><div class=\"grid g2\"><div class=\"card\"><h3>Âge</h3><p>¿Cuántos años tienes? = Quel âge as-tu ?<br>Tengo doce años. = J’ai douze ans.</p></div><div class=\"card\"><h3>TENER - avoir</h3><p>tengo | tienes | tiene | tenemos | tenéis | tienen</p></div><div class=\"card\"><h3>Diminutif</h3><p>zapato → zapatito ; señora → señorita ; Pablo → Pablito ; Juana → Juanita</p></div><div class=\"card\"><h3>Prononciation du cours</h3><p>S → [s]<br>Z et C devant E/I → [θ]<br>Mots à répéter : zapatito, azul, cuántos, años, diez, catorce, dieciséis</p></div></div></section>\n<section><h2>🧠 Vocabulaire actif</h2><p>Clique sur chaque carte pour révéler la traduction, puis essaie de la redire sans regarder.</p><div class=\"grid g3\"><div class=\"card flash\" tabindex=\"0\"><b>¿Cuántos?</b><div class=\"back\">Combien ?</div></div><div class=\"card flash\" tabindex=\"0\"><b>un año</b><div class=\"back\">un an</div></div><div class=\"card flash\" tabindex=\"0\"><b>años</b><div class=\"back\">années</div></div><div class=\"card flash\" tabindex=\"0\"><b>la edad</b><div class=\"back\">l’âge</div></div><div class=\"card flash\" tabindex=\"0\"><b>tengo</b><div class=\"back\">j’ai</div></div><div class=\"card flash\" tabindex=\"0\"><b>tienes</b><div class=\"back\">tu as</div></div><div class=\"card flash\" tabindex=\"0\"><b>tiene</b><div class=\"back\">il/elle a</div></div><div class=\"card flash\" tabindex=\"0\"><b>tenemos</b><div class=\"back\">nous avons</div></div><div class=\"card flash\" tabindex=\"0\"><b>tenéis</b><div class=\"back\">vous avez</div></div><div class=\"card flash\" tabindex=\"0\"><b>tienen</b><div class=\"back\">ils/elles ont</div></div><div class=\"card flash\" tabindex=\"0\"><b>zapatito</b><div class=\"back\">petite chaussure</div></div><div class=\"card flash\" tabindex=\"0\"><b>señorita</b><div class=\"back\">demoiselle</div></div></div></section>\n<section><h2>🎧 Oral - écoute et répète</h2><div class=\"remember\"><b>Méthode :</b> écoute en vitesse normale, répète 3 fois, puis utilise le bouton lent uniquement si nécessaire. Ensuite essaie de redire sans audio.</div><div class=\"oralrow\"><b>¿Cuántos años tienes?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tienes?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tienes?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Tengo doce años.</b><div><button class=\"audio\" onclick=\"speak(\\\"Tengo doce a\\u00f1os.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Tengo doce a\\u00f1os.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>¿Cuántos años tiene tu amigo?</b><div><button class=\"audio\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tiene tu amigo?\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"\\u00bfCu\\u00e1ntos a\\u00f1os tiene tu amigo?\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Mi amigo tiene once años.</b><div><button class=\"audio\" onclick=\"speak(\\\"Mi amigo tiene once a\\u00f1os.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Mi amigo tiene once a\\u00f1os.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>Tenemos trece años.</b><div><button class=\"audio\" onclick=\"speak(\\\"Tenemos trece a\\u00f1os.\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"Tenemos trece a\\u00f1os.\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>zapatito</b><div><button class=\"audio\" onclick=\"speak(\\\"zapatito\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"zapatito\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>azul</b><div><button class=\"audio\" onclick=\"speak(\\\"azul\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"azul\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>cuántos</b><div><button class=\"audio\" onclick=\"speak(\\\"cu\\u00e1ntos\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"cu\\u00e1ntos\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>años</b><div><button class=\"audio\" onclick=\"speak(\\\"a\\u00f1os\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"a\\u00f1os\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>diez</b><div><button class=\"audio\" onclick=\"speak(\\\"diez\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"diez\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>catorce</b><div><button class=\"audio\" onclick=\"speak(\\\"catorce\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"catorce\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div><div class=\"oralrow\"><b>dieciséis</b><div><button class=\"audio\" onclick=\"speak(\\\"diecis\\u00e9is\\\",false)\">🔊 Normal</button><button class=\"audio slow\" onclick=\"speak(\\\"diecis\\u00e9is\\\",true)\">🐢 Lent</button></div><div class=\"mini\">Répète 3 fois : <span class=\"repeatdots\">● ● ●</span></div></div></section>\n<section><h2>✍️ Exercices guidés</h2><div class=\"exercise\"><b>1. Mi amigo ___ trece años.</b><div class=\"input-row\"><input id=\"f1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f1\",[\"tiene\"])'>Vérifier</button></div><div id=\"f1f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>2. Y vosotros, ¿cuántos años ___?</b><div class=\"input-row\"><input id=\"f2\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f2\",[\"tenéis\"])'>Vérifier</button></div><div id=\"f2f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>3. Yo ___ una amiga colombiana.</b><div class=\"input-row\"><input id=\"f3\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f3\",[\"tengo\"])'>Vérifier</button></div><div id=\"f3f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>4. Esteban y yo ___ veinte años.</b><div class=\"input-row\"><input id=\"f4\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f4\",[\"tenemos\"])'>Vérifier</button></div><div id=\"f4f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>5. Y tú, ¿___ una profesora particular?</b><div class=\"input-row\"><input id=\"f5\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f5\",[\"tienes\"])'>Vérifier</button></div><div id=\"f5f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>6. Mis amigos ___ doce años.</b><div class=\"input-row\"><input id=\"f6\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f6\",[\"tienen\"])'>Vérifier</button></div><div id=\"f6f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>7. ITINVESRÉT →</b><div class=\"input-row\"><input id=\"f7\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f7\",[\"veintitrés\"])'>Vérifier</button></div><div id=\"f7f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>8. OCTRAU →</b><div class=\"input-row\"><input id=\"f8\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f8\",[\"cuatro\"])'>Vérifier</button></div><div id=\"f8f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>9. IENUCQ →</b><div class=\"input-row\"><input id=\"f9\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f9\",[\"quince\"])'>Vérifier</button></div><div id=\"f9f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>10. NATRIET →</b><div class=\"input-row\"><input id=\"f10\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f10\",[\"treinta\"])'>Vérifier</button></div><div id=\"f10f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>11. CSEDSIÉII →</b><div class=\"input-row\"><input id=\"f11\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f11\",[\"dieciséis\"])'>Vérifier</button></div><div id=\"f11f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>12. OCRE →</b><div class=\"input-row\"><input id=\"f12\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f12\",[\"cero\"])'>Vérifier</button></div><div id=\"f12f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>13. UITVNEVEINE →</b><div class=\"input-row\"><input id=\"f13\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f13\",[\"veintinueve\"])'>Vérifier</button></div><div id=\"f13f\" class=\"feedback\"></div></div><div class=\"exercise\"><b>14. EZDI →</b><div class=\"input-row\"><input id=\"f14\" type=\"text\"><button class=\"soft\" onclick='checkText(\"f14\",[\"diez\"])'>Vérifier</button></div><div id=\"f14f\" class=\"feedback\"></div></div></section>\n<section><h2>🔄 Traduction / production</h2><div class=\"exercise\"><b>Écris en lettres : 26</b><div class=\"input-row\"><input id=\"e1\" type=\"text\"><button class=\"soft\" onclick='checkText(\"e1\",[\"veintiséis\"])'>Vérifier</button></div><div id=\
